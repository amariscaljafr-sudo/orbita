<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Órbita</title>
<meta name="description" content="Tu espacio personal: calendario, tareas, avisos, notas y secciones a tu medida.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Órbita">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap">
<style>
/* Layout: one white page, ink type, a single red for "today" and alerts. Greeting on top, a large month in the middle, today's list below, a three-button dock at the bottom. */
:root{
  --paper:#ffffff; --paper-2:#f4f4f3; --paper-3:#ebebe9;
  --line:#e7e6e3; --line-2:#d3d2ce;
  --ink:#0d0d0d; --ink-2:#3b3b39; --mute:#8a8985;
  --red:#e0141c; --red-soft:#fdeceb; --on-red:#ffffff;
  --f:"Archivo","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15.5px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

main{width:100%;max-width:1180px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:6px 128px;min-width:0}
.view{display:flex;flex-direction:column;gap:26px}
.view.enter{animation:viewIn .5s var(--ease)}
@keyframes viewIn{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:10px;padding-block:10px;background:var(--paper)}
.top .ttl{text-align:center;font-weight:800;font-stretch:112%;font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--ink);transition:background .2s,transform .15s var(--ease)}
.ibtn:hover{background:var(--paper-2)}
.ibtn:active{transform:scale(.92)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:800;font-size:15px}

.hello{display:grid;grid-template-columns:46px 1fr 46px;align-items:start;gap:10px;padding-top:12px}
.hello .mid{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;padding-top:4px}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:600}
.greet{margin:0;font-weight:900;font-stretch:118%;font-size:clamp(2.35rem,10.5vw,5.4rem);line-height:.9;letter-spacing:-.035em;text-wrap:balance;perspective:600px;cursor:pointer;user-select:none;-webkit-user-select:none;transform-style:preserve-3d;transition:transform .6s var(--ease)}
.greet .w{display:inline-block;white-space:nowrap}
.greet .ch{display:inline-block;transform-origin:50% 100%;animation:chIn .8s var(--ease) both;animation-delay:calc(var(--i) * 26ms)}
.greet .red{color:var(--red)}
@keyframes chIn{from{opacity:0;transform:translateY(.45em) rotateX(-75deg)}to{opacity:1;transform:none}}

.home{display:grid;gap:26px}
@media (min-width:900px){.home{grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);align-items:start;gap:34px}}

.cal{width:100%;max-width:620px;margin:0 auto;touch-action:pan-y}
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.cal-h .m{flex:1;font-weight:900;font-stretch:115%;font-size:clamp(1.5rem,5.6vw,2.1rem);letter-spacing:-.03em;text-transform:capitalize;line-height:1}
.cal-h .m span{color:var(--mute);font-weight:700}
.pillbtn{height:34px;padding:0 13px;border-radius:999px;border:1.5px solid var(--ink);font-weight:700;font-size:13px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk{text-align:center;font-size:11.5px;letter-spacing:.14em;color:var(--mute);font-weight:700;padding-bottom:6px}
.d{aspect-ratio:1/1;max-width:100%;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;font-weight:700;font-size:clamp(15px,4.4vw,22px);letter-spacing:-.01em;transition:background .2s,transform .15s var(--ease),color .2s}
.d:hover{background:var(--paper-2)}
.d:active{transform:scale(.9)}
.d.out{color:#c8c7c3}
.d.wkend:not(.out):not(.today){color:var(--ink-2)}
.d.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.d.today{background:var(--red);color:var(--on-red);font-weight:900;box-shadow:0 10px 24px -10px rgba(224,20,28,.75);animation:todayIn .7s .25s var(--ease) both}
.d.today.sel{box-shadow:0 10px 24px -10px rgba(224,20,28,.75),inset 0 0 0 2px rgba(255,255,255,.6)}
@keyframes todayIn{from{transform:scale(.6);opacity:.2}to{transform:none;opacity:1}}
.d .pip{display:flex;gap:3px;height:5px;position:absolute;bottom:14%}
.d .pip i{width:5px;height:5px;border-radius:50%;background:var(--ink)}
.d .pip i.r{background:var(--red)}
.d.today .pip i{background:var(--on-red)}

.agenda{display:flex;flex-direction:column;gap:6px;min-width:0}
.sec-t{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.sec-t h2{margin:0;font-weight:900;font-stretch:115%;font-size:clamp(1.45rem,5vw,1.9rem);letter-spacing:-.03em;line-height:1}
.sec-t .n{font-weight:700;color:var(--mute);font-size:15px}
.sec-t .sp{flex:1}
.lnk{font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
.lnk svg{width:16px;height:16px}
.row-it{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.row-it:last-child{border-bottom:0}
.row-it .tm{font-weight:700;font-size:14px;color:var(--ink)}
.row-it .tm.all{color:var(--mute);font-weight:600;font-size:12.5px}
.row-it .tt{font-weight:650;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.row-it .lb{font-size:12.5px;color:var(--mute);font-weight:500;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row-it.done .tt{text-decoration:line-through;color:var(--mute)}
.row-it.alert .tm{color:var(--red)}
.tag{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:999px;background:var(--paper-2);font-size:11.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.ex{background:transparent;border:1px dashed var(--line-2);color:var(--mute)}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;flex:none;transition:background .25s var(--ease),transform .2s var(--ease)}
.ck svg{width:15px;height:15px;stroke-width:3.2;stroke:var(--paper);opacity:0;transform:scale(.4);transition:all .25s var(--ease)}
.ck.on{background:var(--ink)}
.ck.on svg{opacity:1;transform:none}
.ck:active{transform:scale(.85)}
.empty{padding:18px;border-radius:var(--r-md);background:var(--paper-2);color:var(--ink-2);font-size:14.5px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty b{color:var(--ink);font-weight:800;font-size:15.5px}
.group-t{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--mute);padding:16px 4px 4px}
.group-t.red{color:var(--red)}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:6px;padding:7px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--line);box-shadow:0 18px 40px -14px rgba(13,13,13,.35)}
.dock:empty{display:none}
.dock button{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;transition:transform .18s var(--ease),background .2s}
.dock button:hover{background:var(--paper-2)}
.dock button:active{transform:scale(.88)}
.dock .add{width:62px;height:62px;background:var(--ink);color:var(--paper)}
.dock .add:hover{background:#262626}
.dock .add svg{width:26px;height:26px;stroke-width:2.4}
.dock .today-n{position:relative}
.dock .today-n b{position:absolute;top:54%;left:50%;transform:translate(-50%,-30%);font-size:9.5px;font-weight:900}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;font-weight:800;font-size:14.5px;background:var(--paper-2);transition:transform .15s var(--ease),background .2s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);background:var(--red-soft)}
.btn.danger.armed{background:var(--red);color:var(--on-red)}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:12px}
.btn svg{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field > label,.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:800}
.inp,.field input[type=text],.field input[type=url],.field input[type=number],.field input[type=date],.field input[type=time],.field select,.field textarea,.search-in{
  width:100%;min-height:50px;padding:12px 15px;border-radius:14px;background:var(--paper-2);border:1.5px solid transparent;outline:none;font-size:16px;transition:border-color .2s,background .2s}
.field textarea{min-height:110px;resize:vertical}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus,.search-in:focus{border-color:var(--ink);background:var(--paper)}
.title-in{font-weight:900!important;font-stretch:112%;font-size:26px!important;letter-spacing:-.02em;background:transparent!important;border:0!important;border-bottom:2px solid var(--line)!important;border-radius:0!important;padding-left:0!important}
.title-in:focus{border-bottom-color:var(--ink)!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input,.stars input,.swatches input,.iconpick input{position:absolute;opacity:0;pointer-events:none}
.seg label{height:40px;padding:0 14px;border-radius:12px;background:var(--paper-2);display:inline-flex;align-items:center;font-size:14px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:all .2s}
.seg input:checked + label{background:var(--ink);color:var(--paper)}
.seg input:focus-visible + label{outline:2px solid var(--red);outline-offset:2px}
.stars{display:flex;gap:2px;align-items:center}
.stars label{cursor:pointer;color:var(--line-2);padding:3px}
.stars label svg{width:30px;height:30px;fill:currentColor;stroke:none}
.stars label.on{color:var(--ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:36px;height:36px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .2s}
.swatches input:checked + .sw{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink);transform:scale(1.05)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:8px 16px;border-radius:14px;background:var(--paper-2);cursor:pointer}
.toggle .sub{display:block;color:var(--mute);font-size:13px;font-weight:500}
.toggle input{appearance:none;-webkit-appearance:none;width:48px;height:30px;border-radius:999px;background:var(--line-2);position:relative;transition:background .25s;flex:none;cursor:pointer;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.toggle input:checked{background:var(--ink)}
.toggle input:checked::after{transform:translateX(18px)}
input[type=range]{width:100%;accent-color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--mute)}
.small{font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 15px;border-radius:999px;background:var(--paper-2);font-size:13.5px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:all .2s}
.chip.on{background:var(--ink);color:var(--paper)}
.chip .n{opacity:.6;font-size:12px}

.box{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;background:var(--paper);min-width:0}
.list{display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:13px;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.it:last-child{border-bottom:0}
.it .tx{flex:1;min-width:0}
.it .tt{font-weight:650;font-size:16px;overflow-wrap:anywhere}
.it .mt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:2px}
.it.done .tt{text-decoration:line-through;color:var(--mute)}
.addline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addline input[type=text]{flex:1;min-width:180px;min-height:50px;padding:12px 15px;border-radius:14px;background:var(--paper-2);border:1.5px solid transparent;outline:none;font-size:16px}
.addline input[type=text]:focus{border-color:var(--ink);background:var(--paper)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{aspect-ratio:1/1;max-width:100%;border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:var(--paper-2);transition:transform .2s var(--ease),background .2s}
.tile:hover{background:var(--paper-3)}
.tile:active{transform:scale(.96)}
.tile .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--ink);color:var(--paper)}
.tile .nm{font-weight:900;font-stretch:108%;font-size:17px;line-height:1.1;letter-spacing:-.015em}
.tile .ct{font-size:12.5px;color:var(--mute);margin-top:4px;font-weight:600}
.tile.add{background:transparent;border:2px dashed var(--line-2)}
.tile.add .ic{background:var(--paper-2);color:var(--ink)}

.entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.entries.lst{grid-template-columns:1fr;gap:0}
.entry{display:flex;flex-direction:column;gap:9px;padding:16px;border-radius:var(--r-md);background:var(--paper-2);text-align:left;cursor:pointer;transition:transform .2s var(--ease),background .2s;min-width:0}
.entry:hover{background:var(--paper-3)}
.entry:active{transform:scale(.985)}
.entry .et{font-weight:850;font-stretch:106%;font-size:17px;line-height:1.2;overflow-wrap:anywhere;letter-spacing:-.01em}
.entry .es{font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.entry .em{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.entries.lst .entry{flex-direction:row;align-items:center;flex-wrap:wrap;background:transparent;border-bottom:1px solid var(--line);border-radius:0;padding:14px 6px}
.entries.lst .entry .et{font-size:16px;flex:1;min-width:150px}
.mini-stars{display:inline-flex;gap:1px;color:var(--ink)}
.mini-stars svg{width:13px;height:13px;fill:currentColor;stroke:none}
.mini-stars .off{color:var(--line-2)}
.bar{height:6px;border-radius:6px;background:var(--paper-3);overflow:hidden;width:100%}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ink)}
.colorchip{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.notes{columns:2 170px;column-gap:12px}
.note{break-inside:avoid;margin-bottom:12px;padding:16px;border-radius:var(--r-md);background:var(--paper-2);cursor:pointer;display:block;width:100%;text-align:left;transition:transform .2s var(--ease)}
.note:active{transform:scale(.98)}
.note h4{margin:0 0 6px;font-weight:850;font-size:16.5px;overflow-wrap:anywhere}
.note p{margin:0;color:var(--ink-2);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden}
.note .mt{margin-top:10px;font-size:12px;color:var(--mute)}
.note.pin{background:var(--ink);color:var(--paper)}
.note.pin p{color:#cfcfcc}
.count{font-weight:900;font-stretch:115%;font-size:46px;line-height:1;letter-spacing:-.03em}

#layer{position:fixed;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(13,13,13,.38);opacity:0;transition:opacity .3s;pointer-events:auto}
#layer.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;pointer-events:auto;background:var(--paper);border-radius:28px 28px 0 0;
  padding:6px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .45s var(--ease);box-shadow:0 -20px 60px rgba(13,13,13,.25)}
#layer.open .sheet{transform:translateY(var(--drag,0px))}
.grab-zone{padding:6px 0 4px;touch-action:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line-2);margin:4px auto 12px}
.sheet-h{display:flex;align-items:center;gap:6px;margin-bottom:16px;position:sticky;top:-6px;z-index:3;background:var(--paper);padding-block:8px}
.sheet-h .t{flex:1;font-weight:900;font-stretch:112%;font-size:23px;letter-spacing:-.02em;line-height:1.1;min-width:0}
.sheet-f{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:22px}
.sheet-f .r{display:flex;gap:10px;margin-left:auto}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(620px,calc(100vw - 48px));border-radius:28px;transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .4s var(--ease),opacity .25s;padding:24px 28px 28px}
  #layer.open .sheet{transform:translate(-50%,-50%);opacity:1}
  .grab-zone{display:none}
}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(86vw,360px);background:var(--paper);pointer-events:auto;overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateX(-102%);transition:transform .42s var(--ease);box-shadow:20px 0 60px rgba(13,13,13,.2);display:flex;flex-direction:column;gap:4px}
#layer.open .drawer{transform:translateX(var(--dragx,0px))}
.drawer .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.drawer .brand b{font-weight:900;font-stretch:120%;font-size:24px;letter-spacing:-.03em}
.drawer .brand b i{font-style:normal;color:var(--red)}
.dnav{display:flex;align-items:center;gap:14px;min-height:52px;padding:0 12px;border-radius:14px;font-weight:750;font-size:16px;transition:background .2s;text-align:left}
.dnav:hover{background:var(--paper-2)}
.dnav.on{background:var(--ink);color:var(--paper)}

function occursOn(ev, key){
  if (!ev.date) return false;
  if (!ev.repeat || ev.repeat === "none") return ev.date === key;
  if (key < ev.date) return false;
  const a = parseYmd(ev.date), b = parseYmd(key);
  if (ev.repeat === "weekly") return a.getDay() === b.getDay();
  if (ev.repeat === "monthly") return a.getDate() === b.getDate();
  if (ev.repeat === "yearly") return ev.date.slice(5) === key.slice(5);
  if (ev.repeat === "daily") return true;
  return false;
}
function nextOcc(ev, fromKey = todayKey()){
  if (!ev.repeat || ev.repeat === "none") return ev.date >= fromKey ? ev.date : null;
  let d = parseYmd(fromKey > ev.date ? fromKey : ev.date);
  for (let i = 0; i < 370; i++){ const k = ymd(d); if (occursOn(ev, k)) return k; d = addDays(d, 1); }
  return null;
}
function dayItems(key){
  const out = [];
  for (const it of all()){
    if (it.kind === "event" && occursOn(it, key)) out.push({t:"event", it, time:it.time || "", end:it.end || "", label:it.important ? "Fecha importante" : "Evento", red:!!it.important || it.color === "red", title:it.title});
    else if (it.kind === "task" && it.date === key) out.push({t:"task", it, time:"", label:it.priority === "alta" && !it.done ? "Prioridad alta" : "Tarea", red:it.priority === "alta" && !it.done, title:it.title});
    else if (it.kind === "reminder" && it.date === key) out.push({t:"reminder", it, time:it.time || "", label:"Aviso", red:!it.done, title:it.title});
    else if (it.kind === "entry"){
      const s = secById(it.sectionId);
      if (s && s.calendar && s.dateKey && it.fields?.[s.dateKey] === key) out.push({t:"entry", it, sec:s, time:(s.timeKey && it.fields?.[s.timeKey]) || "", label:s.name, red:false, title:it.title});
    }
  }
  const bd = profile().birthday;
  if (bd && bd.slice(5) === key.slice(5)) out.push({t:"bday", it:{id:"__bday"}, time:"", label:"Tu cumpleaños", red:true, title:"¡Tu cumpleaños!"});
  return out.sort((a, b) => (a.time || "") < (b.time || "") ? -1 : (a.time || "") > (b.time || "") ? 1 : 0);
}
const tasksDoneCount = eid => { const ts = ofKind("task").filter(t => t.link === eid); return {n:ts.length, d:ts.filter(t => t.done).length}; };

/* ================= toasts & sound ================= */
let audio = null;
document.addEventListener("pointerdown", () => { if (!audio){ try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } }, {once:true});
function chime(){
  if (!audio || S.settings?.sound === false) return;
  try {
    const t = audio.currentTime;
    [660, 990, 1320].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i*.09); g.gain.linearRampToValueAtTime(.12, t + i*.09 + .02); g.gain.exponentialRampToValueAtTime(.0001, t + i*.09 + .9);
      o.connect(g).connect(audio.destination); o.start(t + i*.09); o.stop(t + i*.09 + 1);
    });
  } catch {}
}
function toast(title, text, opts={}){
  const el = document.createElement("div");
  el.className = "toast" + (opts.alert ? " alert" : "");
  el.innerHTML = `${opts.alert ? ic("bell") : ""}<div class="tx"><b>${esc(title)}</b>${text ? esc(text) : ""}</div>${opts.actions || ""}<button class="x" aria-label="Cerrar">${ic("x")}</button>`;
  el.querySelector(".x").onclick = () => el.remove();
  if (opts.onMount) opts.onMount(el);
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), opts.alert ? 60000 : 3600);
}

/* ================= routing ================= */
const ROUTES = ["inicio","calendario","tareas","avisos","notas","secciones","perfil"];
const ROUTE_TITLE = {calendario:"Calendario", tareas:"Tareas", avisos:"Avisos y fechas", notas:"Notas", secciones:"Secciones", perfil:"Tu perfil"};
function currentRoute(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("s-") && secById(h.slice(2))) return h;
  if (h === "ajustes") return "perfil";
  return ROUTES.includes(h) ? h : "inicio";
}
let lastRoute = null;
function render(){
  if (!S.ready || !S.settings) return;
  const r = currentRoute();
  const v = $("#view");
  const y = window.scrollY;
  const focusId = document.activeElement && v.contains(document.activeElement) ? document.activeElement.id : null;
  const changed = r !== lastRoute;
  let html;
  if (r === "inicio") html = vHome(changed);
  else {
    const title = r.startsWith("s-") ? secById(r.slice(2)).name : ROUTE_TITLE[r];
    const fn = {calendario:vCalendar, tareas:vTasks, avisos:vReminders, notas:vNotes, secciones:vSections, perfil:vProfile}[r];
    html = topBar(title) + (fn ? fn() : vSection(secById(r.slice(2))));
  }
  v.innerHTML = `<div class="view${changed ? " enter" : ""}">${html}</div>`;
  renderDock();
  if (changed){ window.scrollTo(0, 0); lastRoute = r; }
  else {
    window.scrollTo(0, y);
    if (focusId){ const f = document.getElementById(focusId); if (f){ f.focus(); try { if (typeof f.value === "string" && f.setSelectionRange) f.setSelectionRange(f.value.length, f.value.length); } catch {} } }
  }
  bindSwipe();
}
function onData(){
  if (!S.ready) return;
  if (!S.settings){ showOnboarding(); return; }
  const ae = document.activeElement;
  const typing = ae && $("#view").contains(ae) && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA") && ae.value;
  if (!typing) render();
  if (S.sheetRefresh) S.sheetRefresh();
}

function splitChars(text, startI, cls){
  let i = startI;
  const html = text.split(" ").filter(Boolean).map(w => `<span class="w${cls ? " " + cls : ""}">${[...w].map(c => `<span class="ch" style="--i:${i++}">${esc(c)}</span>`).join("")}</span>`).join(" ");

}
function greetHtml(animate){

  if (!animate) return `${esc(a)}${b ? `<br><span class="red">${esc(b)}</span>` : ""}`;
  const p1 = splitChars(a, 0, "");
  return p1.html + (b ? "<br>" + splitChars(b, p1.next + 2, "red").html : "");
}
function calHtml(){
  const {y, m, sel} = S.cal;
  const first = new Date(y, m, 1), start = addDays(first, -((first.getDay() + 6) % 7));
  const tk = todayKey();
  let cells = "";
  for (let i = 0; i < 42; i++){
    const d = addDays(start, i), k = ymd(d);
    if (i === 35 && d.getMonth() !== m) break;
    const its = dayItems(k), red = its.some(x => x.red);
    cells += `<button class="d${d.getMonth() !== m ? " out" : ""}${k === tk ? " today" : ""}${k === sel ? " sel" : ""}${d.getDay() % 6 === 0 ? " wkend" : ""}" data-act="pick" data-date="${k}" aria-label="${esc(fmt(d, {weekday:"long", day:"numeric", month:"long"}))}${its.length ? ", " + its.length + " planes" : ""}"${k === tk ? ' aria-current="date"' : ""}>${d.getDate()}${its.length ? `<span class="pip">${its.length > 1 ? "<i></i>" : ""}<i${red ? ' class="r"' : ""}></i></span>` : ""}</button>`;
  }
  const n = new Date(), isCur = y === n.getFullYear() && m === n.getMonth();
  return `<div class="cal" id="cal">
    <div class="cal-h"><div class="m">${esc(fmt(first, {month:"long"}))} <span>${y}</span></div>
      ${isCur && sel === tk ? "" : `<button class="pillbtn" data-act="cal-today">Hoy</button>`}

    <div class="grid7">${["L","M","X","J","V","S","D"].map(w => `<div class="wk">${w}</div>`).join("")}${cells}</div>

function vTasks(){
  const tk = todayKey(), tm = ymd(addDays(new Date(), 1));
  const ts = ofKind("task"), f = S.taskFilter;
  const pend = ts.filter(t => !t.done), done = ts.filter(t => t.done).sort((a,b) => (b.doneAt||0) - (a.doneAt||0));
  const counts = {pendientes:pend.length, hoy:pend.filter(t => t.date && t.date <= tk).length, hechas:done.length};
  const rank = t => ({alta:0, media:1, baja:2}[t.priority] ?? 3);
  const sortP = (a, b) => rank(a) - rank(b) || ((a.date || "9") < (b.date || "9") ? -1 : 1);
  const grp = (title, list, red) => list.length ? `<div class="group-t${red ? " red" : ""}">${title} · ${list.length}</div>${list.sort(sortP).map(taskRow).join("")}` : "";
  let body;
  if (f === "pendientes") body = grp("Atrasadas", pend.filter(t => t.date && t.date < tk), true) + grp("Hoy", pend.filter(t => t.date === tk)) + grp("Mañana", pend.filter(t => t.date === tm)) + grp("Próximas", pend.filter(t => t.date && t.date > tm)) + grp("Sin fecha", pend.filter(t => !t.date));
  else if (f === "hoy") body = grp("Atrasadas", pend.filter(t => t.date && t.date < tk), true) + grp("Hoy", pend.filter(t => t.date === tk));
  else body = grp("Hechas", done);
  return `
  <form class="addline" data-form="quicktask" autocomplete="off">
    <input type="text" id="qt-title" name="title" placeholder="Nueva tarea y pulsa Intro" aria-label="Nueva tarea" enterkeyhint="done">
    <div class="seg">${[["hoy","Hoy"],["manana","Mañana"],["sin","Sin fecha"]].map(([v,l], i) => `<input type="radio" name="when" id="qt-w-${v}" value="${v}"${i === 0 ? " checked" : ""}><label for="qt-w-${v}">${l}</label>`).join("")}</div>
  </form>
  <div class="chips">${[["pendientes","Pendientes"],["hoy","Hoy"],["hechas","Hechas"]].map(([k,l]) => `<button class="chip${f === k ? " on" : ""}" data-act="task-filter" data-f="${k}">${l}<span class="n">${counts[k]}</span></button>`).join("")}</div>
  <div class="list">${body || `<div class="empty"><b>${f === "hechas" ? "Aún no has completado tareas." : "Sin tareas pendientes."}</b>${f === "hechas" ? "Cuando marques una tarea aparecerá aquí." : "Escribe arriba la siguiente cosa que tengas que hacer."}</div>`}</div>`;

/* ================= layer: drawer & sheets ================= */
function openLayer(html, {kind="sheet", onMount, refresh} = {}){
  const L = $("#layer");
  L.innerHTML = kind === "drawer"
    ? `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Menú">${html}</aside>`
    : `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab-zone"><div class="grab"></div></div>${html}</div>`;
  S.sheetRefresh = refresh || null;
  requestAnimationFrame(() => requestAnimationFrame(() => L.classList.add("open")));
  const panel = L.lastElementChild, isD = kind === "drawer";
  const zone = isD ? panel : $(".grab-zone", panel);
  let s0 = null, o0 = 0, d = 0, lock = null;
  zone.addEventListener("pointerdown", e => { if (isD && e.pointerType === "mouse") return; s0 = isD ? e.clientX : e.clientY; o0 = isD ? e.clientY : e.clientX; d = 0; lock = isD ? null : "main"; });
  zone.addEventListener("pointermove", e => {
    if (s0 === null) return;
    const raw = (isD ? e.clientX : e.clientY) - s0, other = (isD ? e.clientY : e.clientX) - o0;
    if (lock === null && (Math.abs(raw) > 8 || Math.abs(other) > 8)) lock = Math.abs(raw) > Math.abs(other) ? "main" : "other";
    if (lock !== "main") return;
    d = isD ? Math.min(0, raw) : Math.max(0, raw);
    panel.style.transition = "none";
    panel.style.setProperty(isD ? "--dragx" : "--drag", d + "px");
  });
  const end = () => { if (s0 === null) return; s0 = null; panel.style.transition = ""; if (Math.abs(d) > 90) closeLayer(); else panel.style.setProperty(isD ? "--dragx" : "--drag", "0px"); };
  zone.addEventListener("pointerup", end); zone.addEventListener("pointercancel", end);
  if (onMount) onMount(panel);
  if (!isD){ const first = $("input[type=text],input[type=search],textarea", panel); if (first && window.matchMedia("(min-width:700px)").matches) setTimeout(() => first.focus(), 60); }
}
function closeLayer(){
  const L = $("#layer"); if (!L.classList.contains("open")) return;
  L.classList.remove("open"); S.sheetRefresh = null;
  setTimeout(() => { if (!L.classList.contains("open")) L.innerHTML = ""; }, 450);
}

function openDay(key){
  let cur = key;

    const its = dayItems(cur), isToday = cur === todayKey();
    const allDay = its.filter(x => !x.time), timed = its.filter(x => x.time);
    let rows = "";
    for (let h = 0; h < 24; h++){
      const hh = pad(h), inH = timed.filter(x => x.time.slice(0, 2) === hh);
      rows += `<div class="hr${isToday && new Date().getHours() === h ? " now" : ""}" id="hr-${h}"><div class="h">${hh}:00</div><div class="slot" data-act="slot" data-date="${cur}" data-h="${hh}" aria-label="Añadir a las ${hh}:00">${inH.map(x => `<button class="blk${x.t === "reminder" && !x.it.done ? " red" : x.t === "entry" || x.t === "task" ? " lite" : ""}${x.it.done ? " done" : ""}" data-act="open" data-id="${x.it.id}">${esc(x.title)}<small>${x.time}${x.end ? "–" + x.end : ""} · ${esc(x.label)}</small></button>`).join("")}</div></div>`;
    }
    return `${sheetHead(esc(cap1(fmt(parseYmd(cur), {weekday:"long", day:"numeric", month:"long"}))), `<button class="ibtn" data-act="day-move" data-d="-1" aria-label="Día anterior">${ic("left")}</button><button class="ibtn" data-act="day-move" data-d="1" aria-label="Día siguiente">${ic("right")}</button>`)}
      ${isToday ? "" : `<div style="margin:-6px 0 12px"><button class="pillbtn" data-act="day-move" data-d="0">Ir a hoy</button></div>`}
      ${allDay.length ? `<div class="allday">${allDay.map(x => `<button class="blk${x.red && !x.it.done ? " red" : " lite"}${x.it.done ? " done" : ""}" style="width:auto" ${x.t === "bday" ? 'data-act="nav" data-to="perfil"' : `data-act="open" data-id="${x.it.id}"`}>${esc(x.title)}<small>${esc(x.label)}</small></button>`).join("")}</div>` : ""}
      <div class="sched" id="sched">${rows}</div>
      <p class="muted small" style="margin:14px 0 0">Toca una hora libre para añadir un evento.</p>`;
  };
  const place = (sh, keepScroll) => {
    const isToday = cur === todayKey(), n = new Date();
    if (!keepScroll){ const target = $("#hr-" + Math.max(0, (isToday ? n.getHours() : 8) - 1), sh); if (target) sh.scrollTop = target.offsetTop - 90; }
    if (isToday){ const hr = $("#hr-" + n.getHours(), sh); if (hr){ const ln = document.createElement("div"); ln.className = "nowline"; ln.style.top = (hr.offsetTop + hr.offsetHeight * n.getMinutes() / 60) + "px"; $("#sched", sh).appendChild(ln); } }
  };
  openLayer(`<div id="dayw">${draw()}</div>`, {
    onMount(sh){ sh._day = {get:() => cur, set:k => { cur = k; $("#dayw", sh).innerHTML = draw(); place(sh); }}; setTimeout(() => place(sh), 40); },
    refresh(){ const sh = $(".sheet"); if (sh && sh._day){ const y = sh.scrollTop; $("#dayw", sh).innerHTML = draw(); place(sh, true); sh.scrollTop = y; } }
  });
}

function fieldInput(f, v, id){
  const n = `f_${f.key}`;
  switch (f.type){
    case "longtext": return `<textarea id="${id}" name="${n}">${esc(v || "")}</textarea>`;
    case "select":
      if (f.options.length <= 6) return `<div class="seg">${["", ...f.options].map((o, i) => `<input type="radio" name="${n}" id="${id}-${i}" value="${esc(o)}"${(v || "") === o ? " checked" : ""}><label for="${id}-${i}">${o ? esc(o) : "—"}</label>`).join("")}</div>`;
      return `<select id="${id}" name="${n}"><option value="">—</option>${f.options.map(o => `<option${v === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    case "rating": return `<div class="stars" data-stars>${[0,1,2,3,4,5].map(i => `<input type="radio" name="${n}" id="${id}-${i}" value="${i}"${(+v || 0) === i ? " checked" : ""}>${i ? `<label for="${id}-${i}" class="${i <= (+v || 0) ? "on" : ""}" aria-label="${i} estrellas"><svg viewBox="0 0 24 24"><path d="${P.star}"/></svg></label>` : ""}`).join("")}<button type="button" class="lnk" data-act="stars-clear" style="margin-left:8px">Quitar</button></div>`;
    case "date": return `<input type="date" id="${id}" name="${n}" value="${esc(v || "")}">`;
    case "time": return `<input type="time" id="${id}" name="${n}" value="${esc(v || "")}">`;
    case "number": return `<input type="number" inputmode="decimal" id="${id}" name="${n}" value="${esc(v ?? "")}">`;
    case "progress": return `<div class="row" style="flex-wrap:nowrap"><input type="range" min="0" max="100" step="5" id="${id}" name="${n}" value="${+v || 0}" oninput="this.nextElementSibling.textContent=this.value+'%'"><span style="width:48px;text-align:right;font-weight:800">${+v || 0}%</span></div>`;
    case "link": return `<div class="row" style="flex-wrap:nowrap"><input type="url" id="${id}" name="${n}" value="${esc(v || "")}" placeholder="https://…">${v ? `<a class="ibtn" style="flex:none;background:var(--paper-2)" href="${esc(safeUrl(v))}" target="_blank" rel="noopener" aria-label="Abrir enlace">${ic("link")}</a>` : ""}</div>`;
    case "check": return `<label class="toggle"><span><b>${esc(f.label)}</b></span><input type="checkbox" id="${id}" name="${n}"${v ? " checked" : ""}></label>`;
    case "color": { const cs = ["#111111","#f4f4f2","#8a8f98","#2f4f8f","#7fb0e8","#2f6b4f","#c9a66b","#8b5a3c","#b23a48","#f2a7b8","#f2d16b","#6b4f9e"]; return `<div class="swatches">${cs.map((c, i) => `<input type="radio" name="${n}" id="${id}-${i}" value="${c}"${v === c ? " checked" : ""}><label class="sw" for="${id}-${i}" style="background:${c}"></label>`).join("")}<input type="radio" name="${n}" id="${id}-x" value=""${!v ? " checked" : ""}><label for="${id}-x" class="lnk" style="cursor:pointer">Ninguno</label></div>`; }
    default: return `<input type="text" id="${id}" name="${n}" value="${esc(v || "")}">`;
  }
}
function openEntry(sid, item, preset={}){

    <form class="stack" data-form="entry" data-id="${e.id}" data-sec="${s.id}" autocomplete="off">
      <div class="field"><input type="text" class="title-in" id="en-title" name="title" value="${esc(e.title)}" placeholder="Nombre" aria-label="Nombre" required></div>
      ${s.fields.map((f, i) => `<div class="field">${f.type === "check" ? "" : `<label for="en-f${i}">${esc(f.label)}</label>`}${fieldInput(f, e.fields[f.key], "en-f" + i)}</div>`).join("")}

function syncDraftSec(){
  const sh = $(".sheet"); if (!sh || !draftSec) return;

/* ================= actions ================= */
function armed(el, msg){
  if (el.classList.contains("armed")) return true;
  const sp = el.querySelector("span") || el, old = sp.textContent;
  el.classList.add("armed"); sp.textContent = msg;
  setTimeout(() => { if (el.isConnected){ el.classList.remove("armed"); sp.textContent = old; } }, 3800);
  return false;
}
const ACT = {

  drawer(){ openDrawer(); },

  day(el){ const k = el.dataset.date || todayKey(); swapLayer(() => openDay(k)); },
  "day-move"(el){ const sh = $(".sheet"); if (!sh?._day) return; const d = +el.dataset.d; sh._day.set(d === 0 ? todayKey() : ymd(addDays(parseYmd(sh._day.get()), d))); },

  add(el){ const {kind, date, sec, time} = el.dataset; swapLayer(() => openItem(kind, null, {date, sec, time})); },
  open(el){ const it = S.items.get(el.dataset.id); if (it) swapLayer(() => openItem(it.kind, it)); },
  toggle(el){
    const it = S.items.get(el.dataset.id); if (!it) return;

  "sec-save"(){

    if (!d.name.trim()) d.name = "Sin nombre";

  },
  "link-task"(el){ const inp = $("#lt-in"); const v = inp?.value.trim(); if (!v) return; putItem({id:uid(), kind:"task", title:v, link:el.dataset.id, date:""}); setTimeout(() => $("#lt-in")?.focus(), 0); },
  "stars-clear"(el){ const w = el.closest("[data-stars]"); const z = $("input[value='0']", w); if (z){ z.checked = true; z.dispatchEvent(new Event("change", {bubbles:true})); } },
  "onb-tpl"(el){ const k = el.dataset.tpl; onbPick.has(k) ? onbPick.delete(k) : onbPick.add(k); el.classList.toggle("on"); el.setAttribute("aria-pressed", onbPick.has(k)); },
  "like-del"(el){ const p = {...profile()}; p.likes = {...(p.likes || {})}; p.likes[el.dataset.k] = (p.likes[el.dataset.k] || []).filter((_, i) => i !== +el.dataset.i); S.settings.profile = p; putSettings(); render(); },
  async export(){
    const data = JSON.stringify({app:"orbita", version:2, exportedAt:new Date().toISOString(), settings:S.settings, items:all()}, null, 2);
    const name = `orbita-copia-${todayKey()}.json`;
    if (window.claude?.use){
      let dl = null; try { dl = await window.claude.use("downloads"); } catch {}
      if (dl){ try { const r = await dl.save({filename:name, data}); if (r?.status === "saved") toast("Copia exportada", name); } catch {} return; }
    }
    try {
      const file = new File([data], name, {type:"application/json"});
      if (navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent)){ navigator.share({files:[file], title:"Copia de Órbita"}).catch(() => {}); return; }
      const url = URL.createObjectURL(file), a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast("Copia exportada", name);
    } catch { copyFallback(data); }
  },
  import(){ $("#importFile").click(); },
  "clear-examples"(){ for (const i of all().filter(i => i.example)) delItem(i.id, true); flushBulk(); toast("Ejemplos borrados", "Tu espacio está listo para tus cosas."); },
  "reset-all"(el){
    if (!armed(el, "Se borrará todo. Toca otra vez")) return;
    for (const i of all()) delItem(i.id, true);
    flushBulk();
    if (S.mode === "db") chain("settings", () => settingsRef.delete());
    S.settings = null; if (S.mode !== "db") saveLocal();
    $("#view").innerHTML = ""; showOnboarding();
  }
};
async function copyFallback(data){
  try { await navigator.clipboard.writeText(data); toast("Copia en el portapapeles", "Pégala en una nota o archivo para guardarla."); }
  catch { toast("No se pudo exportar", "Tu navegador no permite guardar archivos aquí."); }
}
function renderPartial(){
  const cal = $("#cal"), ag = $(".agenda");
  if (!cal || !ag) return render();
  cal.outerHTML = calHtml(); $(".agenda").outerHTML = agendaHtml(); bindSwipe();
}
function moveMonth(d){
  let {y, m} = S.cal; m += d; if (m < 0){ m = 11; y--; } if (m > 11){ m = 0; y++; }
  const tk = todayKey(), first = ymd(new Date(y, m, 1));
  S.cal = {y, m, sel:tk.slice(0, 7) === first.slice(0, 7) ? tk : first};
  renderPartial();
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); e.stopPropagation(); fn(el, e);
}, true);

/* ================= forms ================= */
document.addEventListener("submit", e => {
  const f = e.target; const kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  const fd = new FormData(f);
  if (kind === "quicktask"){
    const t = (fd.get("title") || "").trim(); if (!t) return;
    const w = fd.get("when");
    putItem({id:uid(), kind:"task", title:t, date:w === "hoy" ? todayKey() : w === "manana" ? ymd(addDays(new Date(), 1)) : ""});
    setTimeout(() => { const i = $("#qt-title"); if (i){ i.value = ""; i.focus(); } }, 0);
  } else if (kind === "item"){
    const k = f.dataset.kind, old = S.items.get(f.dataset.id) || {};
    const it = {...old, id:f.dataset.id, kind:k, title:(fd.get("title") || "").trim()};
    if (k === "note"){ it.body = fd.get("body") || ""; it.pinned = !!fd.get("pinned"); if (!it.title && !it.body.trim()) return closeLayer(); }
    else {
      if (!it.title) return;
      it.date = fd.get("date") || ""; it.notes = fd.get("notes") || "";
      if (k === "task"){ it.priority = fd.get("priority") || ""; it.link = fd.has("link") ? fd.get("link") : (old.link || ""); }
      if (k === "event"){ it.repeat = fd.get("repeat") || "none"; it.important = !!fd.get("important"); it.color = fd.get("red") ? "red" : "ink"; if (fd.has("time")){ it.time = fd.get("time") || ""; it.end = fd.get("end") || ""; it.alert = fd.get("alert") || ""; } }
      if (k === "reminder"){ it.time = fd.get("time") || ""; if (old.date !== it.date || old.time !== it.time) it.done = false; }
    }
    putItem(it); closeLayer(); toast(f.dataset.new ? "Guardado" : "Cambios guardados");
  } else if (kind === "entry"){
    const s = secById(f.dataset.sec); if (!s) return;
    const old = S.items.get(f.dataset.id) || {};
    const fields = {};
    for (const fl of s.fields){
      const v = fd.get("f_" + fl.key);
      if (fl.type === "check") fields[fl.key] = !!v;
      else if (fl.type === "rating" || fl.type === "progress") fields[fl.key] = +v || 0;
      else if (fl.type === "number") fields[fl.key] = v === "" || v === null ? "" : +v;
      else fields[fl.key] = (v || "").trim();
    }
    const title = (fd.get("title") || "").trim(); if (!title) return;
    putItem({...old, id:f.dataset.id, kind:"entry", sectionId:s.id, title, fields});
    closeLayer(); toast("Guardado en " + s.name);
  } else if (kind === "profile"){
    S.settings.profile = {...profile(), name:(fd.get("name") || "").trim(), birthday:fd.get("birthday") || "", about:fd.get("about") || ""};
    putSettings(true); render(); toast("Perfil guardado");
  } else if (kind === "onb"){
    finishOnboarding(fd.get("name") || "", !!fd.get("examples"));
  }
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if (e.key === "Enter" && t.dataset && t.dataset.like){
    e.preventDefault();
    const v = t.value.trim(); if (!v) return;
    const p = {...profile()}; p.likes = {...(p.likes || {})}; p.likes[t.dataset.like] = [...(p.likes[t.dataset.like] || []), v];
    S.settings.profile = p; putSettings(); t.value = ""; render(); setTimeout(() => document.getElementById(t.id)?.focus(), 0);
  }
  if (e.key === "Enter" && t.id === "lt-in"){ e.preventDefault(); $("[data-act=link-task]")?.click(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  const st = t.closest("[data-stars]");
  if (st){ const v = +($("input:checked", st)?.value || 0); $$("label", st).forEach((l, i) => l.classList.toggle("on", i < v)); }
  if (t.closest("form[data-form=prefs]")){ S.settings.sound = $("#pf-sound").checked; putSettings(); }
  if ($(".sheet")?._sec && (t.dataset.fp === "type" || t.dataset.sk === "dateKey")){ syncDraftSec(); redrawSecEditor(); }
});
document.addEventListener("input", e => {
  const t = e.target, k = t.dataset.input;
  if (k === "noteq"){ S.noteQuery = t.value; render(); }
  if (k === "secq"){ S.secQuery[t.dataset.sec] = t.value; render(); }
});
$("#importFile").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    const o = JSON.parse(await file.text());
    if (o.app !== "orbita" || !Array.isArray(o.items)) throw 0;
    if (o.settings){ S.settings = {...o.settings}; if (!S.settings.profile) S.settings.profile = {name:o.settings.name || ""}; putSettings(true); }
    for (const it of o.items) if (it && it.id && it.kind) putItem(it, true);
    flushBulk(); toast("Copia importada", `${o.items.length} elementos recuperados.`);
  } catch { toast("Archivo no válido", "Elige una copia exportada desde Órbita (.json)."); }
});

/* ================= gestures & tilt ================= */
function bindSwipe(){
  const g = $("#cal"); if (!g) return;
  let x0 = null, y0 = 0;
  g.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; });
  g.addEventListener("pointerup", e => { if (x0 === null) return; const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) moveMonth(dx < 0 ? 1 : -1); });
}
const fine = window.matchMedia("(hover:hover) and (pointer:fine)");
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
let tiltRaf = 0, tx = 0, ty = 0;
function tilt(x, y){ tx = x; ty = y; if (tiltRaf) return; tiltRaf = requestAnimationFrame(() => { tiltRaf = 0; const g = $("#greet"); if (g && !reduce.matches) g.style.transform = `rotateX(${(-ty * 10).toFixed(2)}deg) rotateY(${(tx * 14).toFixed(2)}deg)`; }); }
addEventListener("pointermove", e => { if (fine.matches) tilt(e.clientX / innerWidth - .5, e.clientY / innerHeight - .5); }, {passive:true});
addEventListener("deviceorientation", e => { if (e.gamma == null) return; tilt(Math.max(-.5, Math.min(.5, e.gamma / 70)), Math.max(-.5, Math.min(.5, (e.beta - 45) / 90))); }, {passive:true});

/* ================= reminders ================= */
const fired = new Set(lsGet("orbita.fired", []));
function checkAlerts(){
  if (!S.ready || !S.settings) return;
  const now = Date.now(), tk = todayKey(), due = [];
  for (const r of ofKind("reminder")){
    if (r.done || !r.date || !r.time) continue;
    const at = parseYmd(r.date).getTime() + (+r.time.slice(0, 2))*36e5 + (+r.time.slice(3, 5))*6e4, key = `r:${r.id}:${r.date}T${r.time}`;
    if (at <= now && now - at < 12*36e5 && !fired.has(key)) due.push({key, it:r, title:r.title, text:`Aviso · ${r.time}`});
  }
  for (const e of ofKind("event")){
    if (e.alert === "" || e.alert == null || !e.time) continue;
    for (const k of [tk, ymd(addDays(new Date(), 1))]){
      if (!occursOn(e, k)) continue;
      const start = parseYmd(k).getTime() + (+e.time.slice(0, 2))*36e5 + (+e.time.slice(3, 5))*6e4, at = start - (+e.alert)*6e4, key = `e:${e.id}:${k}`;
      if (at <= now && now < start + 30*6e4 && !fired.has(key)) due.push({key, it:e, title:e.title, text:+e.alert === 0 ? `Empieza ahora · ${e.time}` : `Empieza ${relDay(k).toLowerCase()} a las ${e.time}`});
    }
  }
  for (const d of due){
    fired.add(d.key);
    toast(d.title, d.text, {alert:true, actions:d.it.kind === "reminder" ? `<button class="btn sm" data-snooze>+10 min</button><button class="btn sm" data-done>Hecho</button>` : "", onMount(el){
      el.querySelector("[data-done]")?.addEventListener("click", () => { const it = S.items.get(d.it.id); if (it) putItem({...it, done:true}); el.remove(); });
      el.querySelector("[data-snooze]")?.addEventListener("click", () => { const it = S.items.get(d.it.id); const t = new Date(Date.now() + 10*6e4); if (it) putItem({...it, date:ymd(t), time:`${pad(t.getHours())}:${pad(t.getMinutes())}`, done:false}); el.remove(); toast("Te aviso en 10 minutos"); });
    }});
  }
  if (due.length){ chime(); lsSet("orbita.fired", [...fired].slice(-300)); }
}
let lastDay = todayKey(), lastMin = -1;
setInterval(() => {
  const n = new Date();
  if (n.getMinutes() === lastMin) return;
  lastMin = n.getMinutes(); checkAlerts();
  if (todayKey() !== lastDay){ const prev = lastDay; lastDay = todayKey(); if (S.cal.sel === prev) S.cal = {y:n.getFullYear(), m:n.getMonth(), sel:lastDay}; render(); }
}, 5000);

/* ================= boot ================= */
(async function boot(){
  await initStore();
  if (S.settings && !S.settings.profile) S.settings.profile = {name:S.settings.name || ""};
  S.ready = true;
  if (!S.settings) showOnboarding(); else { render(); checkAlerts(); }
  if (!window.claude && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
})();
</script>
