<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Órbita</title>
<meta name="description" content="Tu espacio personal: calendario, tareas, avisos, notas y secciones a tu medida.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Órbita">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap">
<style>
/* Layout: one white page, ink type, a single red for "today" and alerts. One-line greeting on top, a large month in the middle, today's list below, a three-button dock at the bottom. */
:root{
  --paper:#ffffff; --paper-2:#f4f4f3; --paper-3:#ebebe9;
  --line:#e7e6e3; --line-2:#d3d2ce;
  --ink:#0d0d0d; --ink-2:#3b3b39; --mute:#8a8985;
  --red:#e0141c; --red-soft:#fdeceb; --on-red:#ffffff;
  --f:"Archivo","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --r-lg:22px; --r-md:16px;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --foot:68px;
  color-scheme:light;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15.5px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

main{width:100%;max-width:1180px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:6px calc(var(--foot) + env(safe-area-inset-bottom,0px) + 28px);min-width:0}
.view{display:flex;flex-direction:column;gap:24px}
.view.enter{animation:viewIn .5s var(--ease)}
@keyframes viewIn{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

/* splash */
#splash{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;z-index:90;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .45s var(--ease),transform .45s var(--ease)}
#splash.out{opacity:0;pointer-events:none}
#splash .logo{position:relative;width:96px;height:96px}
#splash .logo svg{width:96px;height:96px;display:block;overflow:visible}
#splash .logo circle{fill:none;stroke:var(--ink);stroke-width:13;stroke-dasharray:226;stroke-dashoffset:226;animation:ringDraw .9s .05s var(--ease) forwards;stroke-linecap:round}
#splash .logo i{position:absolute;right:2px;top:2px;width:24px;height:24px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px var(--paper);transform:scale(0);transform-origin:50% 50%;animation:dotPop .5s .75s var(--spring) forwards}
#splash b{font-weight:900;font-stretch:122%;font-size:30px;letter-spacing:-.035em;opacity:0;animation:fadeUp .6s .55s var(--ease) forwards}
#splash b em{font-style:normal;color:var(--red)}
@keyframes ringDraw{to{stroke-dashoffset:0}}
@keyframes dotPop{to{transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:10px;padding-block:10px;background:var(--paper)}
.top .ttl{text-align:center;font-weight:800;font-stretch:112%;font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13.5px;color:var(--mute);margin-top:-14px}
.crumb svg{width:16px;height:16px}
.ibtn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--ink);transition:background .2s,transform .15s var(--ease)}
.ibtn:hover{background:var(--paper-2)}
.ibtn:active{transform:scale(.9)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ink) center/cover no-repeat;color:var(--paper);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;overflow:hidden}

/* greeting */
.hello{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;grid-template-areas:"l e r" "g g g";align-items:center;row-gap:2px;column-gap:8px;padding-top:4px}
.hello > .ibtn:first-child{grid-area:l}.hello > .ibtn:last-child{grid-area:r}
.hello .mid{display:contents}
.hello .eyebrow{grid-area:e;text-align:center}
.hello .greet{grid-area:g;text-align:center}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:600}
.greet{margin:0;width:100%;white-space:nowrap;overflow:hidden;font-weight:900;font-stretch:84%;font-size:42px;line-height:1.08;letter-spacing:-.035em;perspective:600px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .6s var(--ease);padding-block:2px}
.greet .ch{display:inline-block;transform-origin:50% 100%;animation:chIn .7s var(--ease) both;animation-delay:calc(var(--i) * 22ms)}
.greet .sp{display:inline-block;width:.28em}
.greet .red{color:var(--red)}
@keyframes chIn{from{opacity:0;transform:translateY(.4em) rotateX(-80deg)}to{opacity:1;transform:none}}

.home{display:grid;gap:24px}
@media (min-width:900px){.home{grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start;gap:40px}}
body.static{position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none}
body.static main{padding-bottom:0}
.view.home-v{height:calc(100vh - var(--foot) - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px) - 8px);height:calc(100dvh - var(--foot) - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px) - 8px);gap:0;overflow:hidden}
.home-v .home{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;gap:clamp(16px,2.6vh,28px);padding-block:clamp(12px,2.2vh,22px) 8px;width:100%;max-width:480px;margin-inline:auto}
.home-v .cal{width:100%;margin-inline:0;flex:none}
.home-v .cal-h{margin-bottom:8px;padding-inline:4px}
.home-v .cal-h .m{font-size:clamp(1.5rem,6vw,1.95rem)}
.home-v .cal-h .ibtn{width:40px;height:40px}
.home-v .grid7{gap:3px}
.home-v .wk{font-size:11px;padding-bottom:5px}
.home-v .d{aspect-ratio:auto;height:clamp(36px,calc((100dvh - 470px) / 6),64px);font-size:clamp(17px,5.2vw,24px);border-radius:12px;font-weight:750}
.home-v .d .pip{bottom:5%}
.home-v .d .pip i{width:4px;height:4px}
.home-v .agenda{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:clamp(14px,2.4vh,22px)}
.ag-block{display:flex;flex-direction:column;min-height:0}
.free-sub{margin:-4px 0 4px;font-size:13px;color:var(--mute)}
@media (max-width:899px){.home-v .free-sub{display:none}}
.more-btn{color:var(--red)!important}
.home-v .ag-block .it{padding:8px 4px}
.home-v .ag-block .it .tt{font-size:15px}
.home-v .ag-block .ck{width:24px;height:24px}
.home-v .row-it .ck{width:26px;height:26px}
.agenda .ag-block + .ag-block{border-top:1px solid var(--line);padding-top:clamp(12px,2vh,18px)}
.page-h h1,.day-h h1{margin:0;font-weight:900;font-stretch:112%;font-size:clamp(1.7rem,6.5vw,2.4rem);letter-spacing:-.03em;line-height:1}
.page-h p,.day-h p{margin:6px 0 0;color:var(--mute);font-size:14px}
.day-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:15;background:var(--paper);padding-block:6px 12px}
.home-v .sec-t{margin-bottom:2px}
.home-v .sec-t h2{font-size:clamp(1.2rem,4.4vw,1.45rem)}
.home-v .row-it{padding:9px 4px;grid-template-columns:54px minmax(0,1fr) auto}
.home-v .row-it .tt{font-size:15px}
.home-v .eyebrow{font-size:10.5px}
.more-btn{align-self:flex-start;margin-top:8px}
@media (min-width:900px){
  .home-v .home{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:clamp(36px,4vw,64px);align-items:start;align-content:center;max-width:1120px;padding-block:20px 16px}
  .home-v .cal{max-width:600px;justify-self:stretch}
  .home-v .d{height:clamp(44px,calc((100dvh - 380px) / 6),84px);font-size:clamp(18px,2.2vw,26px)}
  .home-v .agenda{max-height:100%}
  .home-v .agenda{max-height:100%;align-self:center;max-width:440px}
}

/* calendar */
.cal{width:calc(100% + 12px);margin-inline:-6px;touch-action:pan-y}
@media (min-width:900px){.cal{width:100%;margin-inline:0}}
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:12px;padding-inline:6px}
.cal-h .m{flex:1;font-weight:900;font-stretch:115%;font-size:clamp(1.6rem,6.4vw,2.4rem);letter-spacing:-.03em;text-transform:capitalize;line-height:1}
.cal-h .m span{color:var(--mute);font-weight:700}
.pillbtn{height:34px;padding:0 13px;border-radius:999px;border:1.5px solid var(--ink);font-weight:700;font-size:13px;transition:transform .15s var(--ease)}
.pillbtn:active{transform:scale(.94)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.grid7.next{animation:slideL .35s var(--ease)}
.grid7.prev{animation:slideR .35s var(--ease)}
@keyframes slideL{from{opacity:.2;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.2;transform:translateX(-28px)}to{opacity:1;transform:none}}
.wk{text-align:center;font-size:12px;letter-spacing:.14em;color:var(--mute);font-weight:700;padding-bottom:8px}
.d{aspect-ratio:1/1;max-width:100%;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-weight:750;font-size:clamp(18px,5.6vw,30px);letter-spacing:-.02em;transition:background .2s,transform .2s var(--spring),color .2s}
.d:hover{background:var(--paper-2)}
.d:active{transform:scale(.86)}
.d.out{color:#c8c7c3}
.d.wkend:not(.out):not(.today){color:var(--ink-2)}
.d.sel{box-shadow:inset 0 0 0 2.5px var(--ink)}
.d.sel.pop{animation:selPop .35s var(--spring)}
@keyframes selPop{from{transform:scale(.85)}to{transform:none}}
.d.today{background:var(--red);color:var(--on-red);font-weight:900;box-shadow:0 12px 26px -10px rgba(224,20,28,.8);animation:todayIn .7s .2s var(--spring) both}
.d.today.sel{box-shadow:0 12px 26px -10px rgba(224,20,28,.8),inset 0 0 0 2.5px rgba(255,255,255,.65)}
@keyframes todayIn{from{transform:scale(.6);opacity:.2}to{transform:none;opacity:1}}
.d .pip{display:flex;gap:3px;height:5px;position:absolute;bottom:13%}
.d .pip i{width:5px;height:5px;border-radius:50%;background:var(--ink)}
.d .pip i.r{background:var(--red)}
.d.today .pip i{background:var(--on-red)}

/* agenda */
.agenda{display:flex;flex-direction:column;gap:4px;min-width:0}
.sec-t{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.sec-t h2{margin:0;font-weight:900;font-stretch:115%;font-size:clamp(1.45rem,5vw,1.9rem);letter-spacing:-.03em;line-height:1}
.sec-t .n{font-weight:700;color:var(--mute);font-size:15px}
.sec-t .sp{flex:1}
.lnk{font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
.lnk svg{width:16px;height:16px}
.row-it{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0;transition:background .2s;border-radius:6px}
.row-it:hover{background:var(--paper-2)}
.row-it:last-child{border-bottom:0}
.anim .row-it,.anim .it,.anim .entry,.anim .tile,.anim .note{animation:rowIn .45s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row-it .tm{font-weight:700;font-size:14px}
.row-it .tm.all{color:var(--mute);font-weight:600;font-size:12.5px}
.row-it .tt{font-weight:650;font-size:16px;line-height:1.25;overflow-wrap:anywhere;transition:color .3s}
.row-it .lb{font-size:12.5px;color:var(--mute);font-weight:500;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row-it.done .tt,.it.done .tt{text-decoration:line-through;color:var(--mute)}
.row-it.alert .tm{color:var(--red)}
.tag{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:999px;background:var(--paper-2);font-size:11.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.ex{background:transparent;border:1px dashed var(--line-2);color:var(--mute)}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;flex:none;transition:background .25s var(--ease),transform .25s var(--spring)}
.ck svg{width:15px;height:15px;stroke-width:3.2;stroke:var(--paper);opacity:0;transform:scale(.3);transition:all .3s var(--spring)}
.ck.on{background:var(--ink);transform:scale(1.08)}
.ck.on svg{opacity:1;transform:none}
.ck:active{transform:scale(.8)}
.empty{padding:18px;border-radius:var(--r-md);background:var(--paper-2);color:var(--ink-2);font-size:14.5px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty b{color:var(--ink);font-weight:800;font-size:15.5px}
.group-t{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--mute);padding:16px 4px 4px}
.group-t.red{color:var(--red)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;gap:8px;min-height:var(--foot);
  padding:6px max(18px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  background:var(--paper);border-top:1px solid var(--line);animation:footIn .5s .25s var(--ease) both}
@keyframes footIn{from{transform:translateY(100%)}to{transform:none}}
.dock:empty{display:none}
.dock .ft{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border-radius:14px;font-size:11.5px;font-weight:750;letter-spacing:.02em;color:var(--ink-2);transition:background .2s,transform .2s var(--spring)}
.dock .ft:hover{background:var(--paper-2)}
.dock .ft:active{transform:scale(.9)}
.dock .ft.on{color:var(--ink);background:var(--paper-2)}
.dock .ft.on svg{stroke:var(--red)}
.dock .ft.add.on .plus{background:var(--red)}
.dock .ft.add.on svg{stroke:#fff}
.dock .add .plus{width:34px;height:24px;border-radius:9px;background:var(--ink);color:var(--paper);display:grid;place-items:center;margin-block:-1px}
.dock .add .plus svg{width:17px;height:17px;stroke-width:2.6}
.dock .add{color:var(--ink)}
.dock .today-n{position:relative}
.dock .today-n .ic-wrap{position:relative;display:grid;place-items:center}
.dock .today-n b{position:absolute;top:55%;left:50%;transform:translate(-50%,-30%);font-size:9px;font-weight:900}
@media (min-width:900px){.dock{grid-template-columns:repeat(4,150px);justify-content:center;gap:24px}}

/* search */
.s-group{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.s-group > .lbl{display:flex;justify-content:space-between;align-items:center}
.recent{display:flex;flex-wrap:wrap;gap:8px}
.recent .chip{padding-right:8px}
.recent .chip .x{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;margin-left:2px}
.recent .chip .x svg{width:14px;height:14px}
.sec-hit{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:14px;text-align:left;width:100%;transition:background .2s}
.sec-hit:hover{background:var(--paper-2)}
.sec-hit .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ink);color:var(--paper);flex:none}
.sec-hit .tx{flex:1;min-width:0}
.sec-hit b{display:block;font-weight:800;font-size:15.5px;color:var(--ink)}
.sec-hit span{font-size:12.5px;color:var(--mute)}
.mark{background:var(--red-soft);color:var(--red);border-radius:4px;padding:0 2px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:800;font-size:14.5px;background:var(--paper-2);transition:transform .15s var(--ease),background .2s;text-align:center}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);background:var(--red-soft)}
.btn.danger.armed{background:var(--red);color:var(--on-red)}
.btn.sm{min-height:38px;padding:0 14px;font-size:13.5px;border-radius:12px}
.btn.lg{min-height:56px;padding:0 28px;font-size:16px}
.btn svg{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field > label,.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:800}
.inp,.field input[type=text],.field input[type=url],.field input[type=number],.field input[type=date],.field input[type=time],.field input[type=password],.field select,.field textarea,.search-in{
  width:100%;min-height:50px;padding:12px 15px;border-radius:14px;background:var(--paper-2);border:1.5px solid transparent;outline:none;font-size:16px;transition:border-color .2s,background .2s}
.field textarea{min-height:110px;resize:vertical}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus,.search-in:focus{border-color:var(--ink);background:var(--paper)}
.title-in{font-weight:900!important;font-stretch:112%;font-size:26px!important;letter-spacing:-.02em;background:transparent!important;border:0!important;border-bottom:2px solid var(--line)!important;border-radius:0!important;padding-left:0!important}
.title-in:focus{border-bottom-color:var(--ink)!important}
.at{position:relative}
.at::before{content:"@";position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mute);font-weight:700;pointer-events:none}
.at input{padding-left:34px!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input,.stars input,.swatches input,.iconpick input{position:absolute;opacity:0;pointer-events:none}
.seg label{min-height:40px;padding:0 14px;border-radius:12px;background:var(--paper-2);display:inline-flex;align-items:center;font-size:14px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:all .2s var(--ease)}
.seg label:active{transform:scale(.95)}
.seg input:checked + label{background:var(--ink);color:var(--paper)}
.seg input:focus-visible + label{outline:2px solid var(--red);outline-offset:2px}
.stars{display:flex;gap:2px;align-items:center}
.stars label{cursor:pointer;color:var(--line-2);padding:3px;transition:transform .2s var(--spring)}
.stars label:active{transform:scale(1.25)}
.stars label svg{width:30px;height:30px;fill:currentColor;stroke:none}
.stars label.on{color:var(--ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:36px;height:36px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .2s}
.swatches input:checked + .sw{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink);transform:scale(1.05)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:8px 16px;border-radius:14px;background:var(--paper-2);cursor:pointer}
.toggle .sub{display:block;color:var(--mute);font-size:13px;font-weight:500}
.toggle input{appearance:none;-webkit-appearance:none;width:48px;height:30px;border-radius:999px;background:var(--line-2);position:relative;transition:background .25s;flex:none;cursor:pointer;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.toggle input:checked{background:var(--ink)}
.toggle input:checked::after{transform:translateX(18px)}
input[type=range]{width:100%;accent-color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--mute)}
.small{font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 15px;border-radius:999px;background:var(--paper-2);font-size:13.5px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:all .2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--paper)}
.chip .n{opacity:.6;font-size:12px}

.box{border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;background:var(--paper);min-width:0}
.list{display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:13px;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0;border-radius:6px;transition:background .2s}
.it:hover{background:var(--paper-2)}
.it:last-child{border-bottom:0}
.it .tx{flex:1;min-width:0}
.it .tt{font-weight:650;font-size:16px;overflow-wrap:anywhere}
.it .mt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:2px}
.it > svg{color:var(--mute)}
.addline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addline input[type=number]{flex:1;min-width:140px}
.addline input[type=text]{flex:1;min-width:180px;min-height:50px;padding:12px 15px;border-radius:14px;background:var(--paper-2);border:1.5px solid transparent;outline:none;font-size:16px}
.addline input[type=text]:focus{border-color:var(--ink);background:var(--paper)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{aspect-ratio:1/1;max-width:100%;border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:var(--paper-2);transition:transform .25s var(--spring),background .2s}
.tile:hover{background:var(--paper-3)}
.tile:active{transform:scale(.95)}
.tile .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--ink);color:var(--paper)}
.tile .nm{font-weight:900;font-stretch:108%;font-size:17px;line-height:1.1;letter-spacing:-.015em}
.tile .ct{font-size:12.5px;color:var(--mute);margin-top:4px;font-weight:600}
.tile.add{background:transparent;border:2px dashed var(--line-2)}
.tile.add .ic{background:var(--paper-2);color:var(--ink)}
.tiles.sm{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.tiles.sm .tile{aspect-ratio:auto;min-height:118px;gap:14px}

.entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.entries.lst{grid-template-columns:1fr;gap:0}
.entry{display:flex;flex-direction:column;gap:9px;padding:16px;border-radius:var(--r-md);background:var(--paper-2);text-align:left;cursor:pointer;transition:transform .2s var(--ease),background .2s;min-width:0}
.entry:hover{background:var(--paper-3)}
.entry:active{transform:scale(.985)}
.entry .et{font-weight:850;font-stretch:106%;font-size:17px;line-height:1.2;overflow-wrap:anywhere;letter-spacing:-.01em}
.entry .es{font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.entry .em{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.entries.lst .entry{flex-direction:row;align-items:center;flex-wrap:wrap;background:transparent;border-bottom:1px solid var(--line);border-radius:0;padding:14px 6px}
.entries.lst .entry .et{font-size:16px;flex:1;min-width:150px}
.mini-stars{display:inline-flex;gap:1px;color:var(--ink)}
.mini-stars svg{width:13px;height:13px;fill:currentColor;stroke:none}
.mini-stars .off{color:var(--line-2)}
.bar{height:6px;border-radius:6px;background:var(--paper-3);overflow:hidden;width:100%}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ink);transition:width .6s var(--ease)}
.colorchip{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.notes{columns:2 170px;column-gap:12px}
.note{break-inside:avoid;margin-bottom:12px;padding:16px;border-radius:var(--r-md);background:var(--paper-2);cursor:pointer;display:block;width:100%;text-align:left;transition:transform .2s var(--ease)}
.note:active{transform:scale(.98)}
.note h4{margin:0 0 6px;font-weight:850;font-size:16.5px;overflow-wrap:anywhere}
.note p{margin:0;color:var(--ink-2);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden}
.note .mt{margin-top:10px;font-size:12px;color:var(--mute)}
.note.pin{background:var(--ink);color:var(--paper)}
.note.pin p{color:#cfcfcc}
.count{font-weight:900;font-stretch:115%;font-size:46px;line-height:1;letter-spacing:-.03em}
.sub-h{font-weight:900;font-stretch:112%;font-size:19px;letter-spacing:-.02em;margin:0}

/* layer */
#layer{position:fixed;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(13,13,13,.38);opacity:0;transition:opacity .3s;pointer-events:auto}
#layer.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;pointer-events:auto;background:var(--paper);border-radius:28px 28px 0 0;
  padding:6px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .5s var(--ease);box-shadow:0 -20px 60px rgba(13,13,13,.25)}
#layer.open .sheet{transform:translateY(var(--drag,0px))}
.grab-zone{padding:6px 0 4px;touch-action:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line-2);margin:4px auto 8px}
.sheet-h{display:flex;align-items:center;gap:6px;margin-bottom:14px;position:sticky;top:-6px;z-index:3;background:var(--paper);padding-block:8px}
.sheet-h .t{flex:1;font-weight:900;font-stretch:112%;font-size:23px;letter-spacing:-.02em;line-height:1.1;min-width:0}
.sheet-f{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:22px}
.sheet-f .r{display:flex;gap:10px;margin-left:auto}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(620px,calc(100vw - 48px));border-radius:28px;transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .45s var(--ease),opacity .25s;padding:24px 28px 28px}
  #layer.open .sheet{transform:translate(-50%,-50%);opacity:1}
  .grab-zone{display:none}
}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(86vw,360px);background:var(--paper);pointer-events:auto;overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateX(-102%);transition:transform .45s var(--ease);box-shadow:20px 0 60px rgba(13,13,13,.2);display:flex;flex-direction:column;gap:2px}
#layer.open .drawer{transform:translateX(var(--dragx,0px))}
.drawer .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.drawer .brand b{font-weight:900;font-stretch:120%;font-size:24px;letter-spacing:-.03em}
.drawer .brand b i{font-style:normal;color:var(--red)}
.dnav{display:flex;align-items:center;gap:14px;min-height:50px;padding:0 12px;border-radius:14px;font-weight:750;font-size:16px;transition:background .2s,transform .15s var(--ease);text-align:left}
.dnav:hover{background:var(--paper-2)}
.dnav:active{transform:scale(.98)}
.dnav.on{background:var(--ink);color:var(--paper)}
.dnav.child{min-height:42px;font-size:14.5px;font-weight:650;padding-left:48px;color:var(--ink-2)}
.dnav.child.on{color:var(--paper)}
.dnav .n{margin-left:auto;font-size:13px;color:var(--mute);font-weight:700}
.dnav.on .n{color:#bdbdb9}
.dnav.ai{background:var(--paper-2);margin-bottom:6px}
.dnav.ai svg{color:var(--red)}
.dnav.ai.on svg{color:#fff}
.drawer .ver{margin-top:auto;padding:18px 12px 0;font-size:12px;color:var(--mute)}
.dlabel{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:800;padding:18px 12px 6px}

/* schedule */
.sched{display:flex;flex-direction:column;position:relative}
.hr{display:grid;grid-template-columns:52px 1fr;gap:10px;min-height:58px;border-top:1px solid var(--line);position:relative}
.hr .h{font-weight:700;font-size:13px;color:var(--mute);padding-top:6px}
.hr.now .h{color:var(--red)}
.hr .slot{padding:5px 0;display:flex;flex-direction:column;gap:5px;cursor:pointer;min-width:0;min-height:56px;border-radius:10px;transition:background .2s}
.hr .slot:empty:hover{background:var(--paper-2)}
.blk{padding:9px 12px;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14.5px;line-height:1.25;text-align:left;width:100%;overflow-wrap:anywhere;transition:transform .15s var(--ease)}
.blk:active{transform:scale(.98)}
.blk small{display:block;font-weight:500;font-size:12px;opacity:.7;margin-top:1px}
.blk.lite{background:var(--paper-2);color:var(--ink)}
.blk.red{background:var(--red);color:var(--on-red)}
.blk.done{opacity:.45;text-decoration:line-through}
.nowline{position:absolute;left:62px;right:0;height:2px;background:var(--red);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.allday{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:15px;border-radius:18px;background:var(--paper-2);text-align:left;font-weight:800;font-size:15px;transition:transform .2s var(--spring),background .2s}
.qa button:hover{background:var(--paper-3)}
.qa button:active{transform:scale(.94)}
.qa .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ink);color:var(--paper)}
.qa .ic.red{background:var(--red)}
.qa .qd{font-size:12.5px;color:var(--mute);font-weight:500;margin-top:-6px}
.ai-card{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:18px;background:var(--ink);color:var(--paper);text-align:left;margin-bottom:12px;transition:transform .2s var(--spring)}
.ai-card:active{transform:scale(.97)}
.ai-card .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--red);flex:none}
.ai-card b{display:block;font-size:16px;color:#fff}
.ai-card span{font-size:13px;color:#bdbdb9}
.fieldrow{display:grid;grid-template-columns:1fr 150px 46px;gap:8px;align-items:start;padding:10px;border-radius:14px;background:var(--paper-2)}
.fieldrow .inp{background:var(--paper)}
.fieldrow .opts{grid-column:1/-1}
@media (max-width:440px){.fieldrow{grid-template-columns:1fr 46px}}
.iconpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.iconpick label{height:46px;border-radius:12px;display:grid;place-items:center;background:var(--paper-2);cursor:pointer}
.iconpick input:checked + label{background:var(--ink);color:var(--paper)}

/* profile */
.prof{display:flex;align-items:center;gap:18px}
.prof .avatar{width:84px;height:84px;font-size:34px;font-stretch:115%;cursor:pointer;position:relative}
.prof .avatar::after{content:"Cambiar";position:absolute;inset:auto 0 0;height:26px;display:grid;place-items:center;font-size:10.5px;font-weight:800;letter-spacing:.04em;background:rgba(0,0,0,.55);color:#fff}
.prof h1{margin:0;font-weight:900;font-stretch:118%;font-size:clamp(1.9rem,7vw,2.8rem);letter-spacing:-.035em;line-height:.95;overflow-wrap:anywhere}
.cols{display:grid;gap:16px}
@media (min-width:900px){.cols{grid-template-columns:1fr 1fr;align-items:start}}
.set-list{display:flex;flex-direction:column}
.set-row{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%;cursor:pointer}
.set-row:last-child{border-bottom:0}
.set-row .tx{flex:1;min-width:0}
.set-row b{display:block;font-weight:750;font-size:15.5px}
.set-row span{font-size:13px;color:var(--mute)}
.set-row > svg:last-child{color:var(--mute)}
.prose{font-size:15px;color:var(--ink-2);display:flex;flex-direction:column;gap:12px}
.prose h3{margin:8px 0 0;font-size:16px;color:var(--ink);font-weight:850}
.prose p{margin:0}
details.faq{border-bottom:1px solid var(--line);padding:6px 0}
details.faq summary{cursor:pointer;font-weight:750;font-size:15.5px;padding:10px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.faq summary::after{content:"+";font-weight:800;color:var(--mute)}
details.faq[open] summary::after{content:"–"}
details.faq p{margin:0 0 10px;color:var(--ink-2);font-size:14.5px}

/* toasts */
#toasts{position:fixed;z-index:95;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:18px;background:var(--ink);color:var(--paper);box-shadow:0 20px 50px -10px rgba(13,13,13,.45);animation:toastIn .5s var(--spring)}
.toast .tx{flex:1;min-width:0;font-size:14px;color:#d7d7d3}
.toast .tx b{display:block;font-size:15.5px;color:var(--paper);font-weight:800}
.toast.alert{background:var(--red)}
.toast.alert .tx{color:#ffe1df}
.toast .btn.sm{background:rgba(255,255,255,.16);color:#fff}
.toast .x{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.94)}}

/* onboarding */
.onb{position:fixed;inset:0;z-index:55;overflow-y:auto;background:var(--paper)}
.onb-in{max-width:640px;min-height:100%;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:24px}
.onb-in > .grow{flex:1;display:flex;flex-direction:column;gap:22px;animation:fadeUp .5s var(--ease)}
.onb .big{margin:0;font-weight:900;font-stretch:120%;font-size:clamp(2.6rem,11vw,5rem);line-height:.88;letter-spacing:-.04em;text-wrap:balance}
.onb .big i{font-style:normal;color:var(--red)}
.onb .lead{font-size:17px;color:var(--ink-2);max-width:48ch;margin:0}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--ink)}
.prog i.cur{background:var(--red)}
.onb-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pick button{display:flex;align-items:center;gap:10px;padding:13px;border-radius:16px;background:var(--paper-2);text-align:left;font-weight:750;font-size:14.5px;transition:all .25s var(--spring);min-height:60px}
.pick button:active{transform:scale(.95)}
.pick button .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--paper);flex:none}
.pick button .ic svg{width:18px;height:18px}
.pick button.on{background:var(--ink);color:var(--paper)}
.pick button.on .ic{background:var(--red);color:#fff}
.note-box{font-size:13.5px;color:var(--ink-2);padding:13px 15px;border-radius:14px;background:var(--paper-2)}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick .avatar{width:64px;height:64px;font-size:26px;cursor:pointer}

/* lock */
.lock{position:fixed;inset:0;z-index:85;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.lock .avatar{width:72px;height:72px;font-size:30px}
.lock h2{margin:0;font-weight:900;font-stretch:115%;font-size:24px;letter-spacing:-.02em}
.pin-dots{display:flex;gap:14px}
.pin-dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--ink);transition:background .15s,transform .2s var(--spring)}
.pin-dots i.on{background:var(--ink);transform:scale(1.1)}
.pin-dots.bad{animation:shake .4s}
.pin-dots.bad i{border-color:var(--red)}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{width:76px;height:76px;border-radius:50%;background:var(--paper-2);font-weight:800;font-size:26px;transition:transform .15s var(--spring),background .15s}
.pad button:active{transform:scale(.88);background:var(--paper-3)}
.pad button.ghost{background:transparent}

/* assistant */
.chat{display:flex;flex-direction:column;gap:10px;min-height:200px}
.msg{max-width:88%;padding:11px 15px;border-radius:18px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;animation:rowIn .35s var(--ease)}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--paper-2);border-bottom-left-radius:6px}
.msg.act{align-self:flex-start;background:transparent;border:1.5px solid var(--line);font-size:13px;font-weight:700;padding:7px 12px;color:var(--ink-2)}
.msg.err{align-self:flex-start;background:var(--red-soft);color:var(--red);font-weight:600}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;background:var(--paper-2);border-radius:18px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chat-in.page{bottom:calc(var(--foot) + env(safe-area-inset-bottom,0px) + 6px)}
.chat-in{position:sticky;bottom:-24px;background:var(--paper);padding-block:12px 4px;display:flex;gap:8px;align-items:flex-end}
.chat-in textarea{flex:1;min-height:50px;max-height:140px;padding:13px 15px;border-radius:16px;background:var(--paper-2);border:1.5px solid transparent;outline:none;font-size:16px;resize:none}
.chat-in textarea:focus{border-color:var(--ink);background:var(--paper)}
.chat-in .btn{width:50px;padding:0;min-height:50px}


/* wardrobe */
.entry.has-img{padding-top:0;overflow:hidden}
.e-img{display:block;position:relative;margin:0 -16px 2px;aspect-ratio:4/3;max-width:calc(100% + 32px);background:var(--paper-3);overflow:hidden}
.e-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease)}
.entry:hover .e-img img{transform:scale(1.04)}
.e-3d{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;background:rgba(13,13,13,.78);color:#fff;font-style:normal;font-size:11.5px;font-weight:800}
.e-3d svg{width:13px;height:13px}
.entries.lst .e-img{display:none}
.ph-field{display:flex;flex-direction:column;gap:8px}
.ph-list{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:84px;height:84px;border-radius:14px;overflow:hidden;background:var(--paper-3)}

let itemsCol = null, settingsRef = null;
const chains = new Map();
function chain(key, fn){ const p = (chains.get(key) || Promise.resolve()).then(fn).catch(handleDbErr); chains.set(key, p); return p; }
function handleDbErr(e){
  const c = e && e.code;
  if (c === "quota_exceeded") toast("Espacio lleno", "Has llegado al límite de elementos. Borra algunos para seguir.");
  else if (c === "invalid_argument") toast("No se pudo guardar", "Tu acceso a esta página es de solo lectura.");
  else toast("No se pudo guardar", "Revisa tu conexión y vuelve a intentarlo.");
}
function loadLocal(){ const o = lsGet(LS_KEY, null); if (o){ S.settings = o.settings || null; S.items = new Map((o.items || []).map(i => [i.id, i])); } }
function saveLocal(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({settings:S.settings, items:[...S.items.values()]})); }
  catch { toast("No queda espacio en el dispositivo", "Borra elementos o una foto de perfil grande para seguir guardando."); }
}
const clean = o => JSON.parse(JSON.stringify(o));

async function initStore(){
  if (!window.claude || typeof window.claude.use !== "function"){
    loadLocal();
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch {}
    return;
  }
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch {}
  let id = null;
  try { id = user ? await user.id() : null; } catch {}
  if (!db || !id){ loadLocal(); return; }
  S.mode = "db";
  settingsRef = db.doc(`data/users/${id}/settings`);
  itemsCol = db.doc(`data/users/${id}/space`).collection("items");
  await new Promise(resolve => {
    let gotS = false, gotI = false, done = false;
    const finish = () => { if (!done && gotS && gotI){ done = true; resolve(); } };
    setTimeout(() => { gotS = gotI = true; finish(); }, 7000);
    settingsRef.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites && S.settings) return;
      if (!snap.exists && snap.metadata.fromCache && !gotS) return;
      S.settings = snap.exists ? structuredClone(snap.data()) : null;
      gotS = true; finish(); if (S.ready) onData();
    }, () => { gotS = true; finish(); });
    itemsCol.limit(1000).onSnapshot(snap => {
      S.items = new Map(snap.docs.map(d => [d.id, {...structuredClone(d.data()), id:d.id}]));
      gotI = true; finish(); if (S.ready) onData();
    }, () => { gotI = true; finish(); });
  });
}
function putItem(it, bulk=false){
  it = clean({...it, updatedAt:Date.now()});
  if (!it.createdAt) it.createdAt = Date.now();
  S.items.set(it.id, it);
  if (S.mode === "db") chain(bulk ? "bulk" : it.id, () => itemsCol.doc(it.id).set(it));
  else if (!bulk) saveLocal();
  if (!bulk) onData();
  return it;
}
function delItem(id, bulk=false){
  S.items.delete(id);
  if (S.mode === "db") chain(bulk ? "bulk" : id, () => itemsCol.doc(id).delete());
  else if (!bulk) saveLocal();
  if (!bulk) onData();
}
function flushBulk(){ if (S.mode !== "db") saveLocal(); onData(); }
let setTimer;
function putSettings(now=false){
  S.settings = clean(S.settings);
  if (S.mode === "db"){
    clearTimeout(setTimer);
    const run = () => chain("settings", () => settingsRef.set(S.settings));
    now ? run() : (setTimer = setTimeout(run, 450));
  } else saveLocal();
}

const all = () => [...S.items.values()];
const ofKind = k => all().filter(i => i.kind === k);
const sections = () => (S.settings?.sections || []);
const topSections = () => sections().filter(s => !s.hidden && (!s.parentId || !secById(s.parentId)));
const childrenOf = id => sections().filter(s => s.parentId === id);
const secById = id => sections().find(s => s.id === id);
const descendants = id => childrenOf(id).flatMap(c => [c, ...descendants(c.id)]);
const entriesOf = sid => ofKind("entry").filter(e => e.sectionId === sid);
const deepCount = sid => entriesOf(sid).length + descendants(sid).reduce((n, c) => n + entriesOf(c.id).length, 0);
const profile = () => S.settings?.profile || {};
const myName = () => (profile().name || "").trim();
function occursOn(ev, key){
  if (!ev.date) return false;
  if (ev.repeat && ev.repeat !== "none"){ if (ev.until && key > ev.until) return false; if (Array.isArray(ev.skip) && ev.skip.includes(key)) return false; }
  if (ev.repeat === "days") return key >= ev.date && Array.isArray(ev.days) && ev.days.includes(dowOf(key));
  if (!ev.repeat || ev.repeat === "none") return ev.date === key;
  if (key < ev.date) return false;
  const a = parseYmd(ev.date), b = parseYmd(key);
  if (ev.repeat === "weekly") return a.getDay() === b.getDay();
  if (ev.repeat === "monthly") return a.getDate() === b.getDate();
  if (ev.repeat === "yearly") return ev.date.slice(5) === key.slice(5);
  if (ev.repeat === "daily") return true;
  return false;
}
function nextOcc(ev, fromKey = todayKey()){
  if (!ev.repeat || ev.repeat === "none") return ev.date >= fromKey ? ev.date : null;
  let d = parseYmd(fromKey > ev.date ? fromKey : ev.date);
  for (let i = 0; i < 370; i++){ const k = ymd(d); if (occursOn(ev, k)) return k; d = addDays(d, 1); }
  return null;
}
function entryOn(e, s, key){
  if (s.daysKey){ const ds = e.fields?.[s.daysKey]; if (Array.isArray(ds) && ds.length) return ds.includes(dowOf(key)); if (!s.dateKey) return false; }
  const d = e.fields?.[s.dateKey]; if (!isDate(d)) return false;
  if (s.repeatKey && e.fields?.[s.repeatKey]) return occursOn({date:d, repeat:"weekly"}, key);
  return d === key;
}
function dayItems(key){
  const out = [];
  for (const it of all()){
    if (it.kind === "event" && occursOn(it, key)) out.push({t:"event", it, time:it.time || "", end:it.end || "", label:it.important ? "Fecha importante" : "Evento", red:!!it.important || it.color === "red", title:it.title});
    else if (it.kind === "task" && it.date === key) out.push({t:"task", it, time:"", label:it.priority === "alta" && !it.done ? "Prioridad alta" : "Tarea", red:it.priority === "alta" && !it.done, title:it.title});
    else if (it.kind === "reminder" && it.date === key) out.push({t:"reminder", it, time:it.time || "", label:"Aviso", red:!it.done, title:it.title});
    else if (it.kind === "entry"){
      const s = secById(it.sectionId), sc = s && schedOf(s, it);
      if (sc && sc.calendar && (sc.dateKey || sc.daysKey) && entryOn(it, sc, key)) out.push({t:"entry", it, sec:s, time:(sc.timeKey && it.fields?.[sc.timeKey]) || "", label:sc.label || secPath(s), red:!!(sc.red && sc.red(it)), title:it.title});
    }
  }
  const bd = profile().birthday;
  if (bd && bd.slice(5) === key.slice(5)) out.push({t:"bday", it:{id:"__bday"}, time:"", label:"Tu cumpleaños", red:true, title:"¡Tu cumpleaños!"});
  return out.sort((a, b) => (a.time || "") < (b.time || "") ? -1 : (a.time || "") > (b.time || "") ? 1 : 0);
}
const secPath = s => { const p = s.parentId ? secById(s.parentId) : null; return p ? `${p.name} · ${s.name}` : s.name; };
const tasksDoneCount = eid => { const ts = ofKind("task").filter(t => t.link === eid); return {n:ts.length, d:ts.filter(t => t.done).length}; };

let audio = null;
document.addEventListener("pointerdown", () => { if (!audio){ try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } }, {once:true});
function chime(){
  if (!audio || S.settings?.sound === false) return;
  try {
    const t = audio.currentTime;
    [660, 990, 1320].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i*.09); g.gain.linearRampToValueAtTime(.12, t + i*.09 + .02); g.gain.exponentialRampToValueAtTime(.0001, t + i*.09 + .9);
      o.connect(g).connect(audio.destination); o.start(t + i*.09); o.stop(t + i*.09 + 1);
    });
  } catch {}
}
function toast(title, text, opts={}){
  const el = document.createElement("div");
  el.className = "toast" + (opts.alert ? " alert" : "");
  el.innerHTML = `${opts.alert ? ic("bell") : ""}<div class="tx"><b>${esc(title)}</b>${text ? esc(text) : ""}</div>${opts.actions || ""}<button class="x" aria-label="Cerrar">${ic("x")}</button>`;
  el.querySelector(".x").onclick = () => el.remove();
  if (opts.onMount) opts.onMount(el);
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), opts.alert ? 60000 : opts.ms || 3600);
}

const ROUTES = ["inicio","buscar","nuevo","horario","asistente","probador","avatar","calendario","tareas","avisos","notas","secciones","perfil"];

function currentRoute(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("s-") && secById(h.slice(2))) return h;
  if (h === "ajustes") return "perfil";
  return ROUTES.includes(h) ? h : "inicio";
}
let lastRoute = null;
function render(){
  if (!S.ready || !S.settings || S.locked) return;
  const r = currentRoute();
  const v = $("#view");
  const y = window.scrollY;
  const focusId = document.activeElement && v.contains(document.activeElement) ? document.activeElement.id : null;
  const changed = r !== lastRoute;
  if (changed) S.listAnim = true;
  let html;
  if (r === "inicio") html = vHome(changed);
  else {
    const sec = r.startsWith("s-") ? secById(r.slice(2)) : null;
    const fn = {asistente:vAssistant, probador:vProbador, avatar:vAvatar, buscar:vSearch, nuevo:vNew, horario:vDay, calendario:vCalendar, tareas:vTasks, avisos:vReminders, notas:vNotes, secciones:vSections, perfil:vProfile}[r];
    html = topBar(sec ? sec.name : ROUTE_TITLE[r]) + (fn ? fn() : vSection(sec));
  }
  document.body.classList.toggle("static", r === "inicio");
  v.innerHTML = `<div class="view${r === "inicio" ? " home-v" : ""}${changed ? " enter" : ""}${S.listAnim ? " anim" : ""}">${html}</div>`;
  S.listAnim = false; S.calAnim = "";
  $$(".anim .row-it, .anim .it, .anim .entry, .anim .tile, .anim .note", v).forEach((el, i) => el.style.setProperty("--i", Math.min(i, 14)));
  renderDock();
  if (changed){ window.scrollTo(0, 0); lastRoute = r; }
  else {
    window.scrollTo(0, y);
    if (focusId){ const f = document.getElementById(focusId); if (f){ f.focus(); try { if (typeof f.value === "string" && f.setSelectionRange) f.setSelectionRange(f.value.length, f.value.length); } catch {} } }
  }
  bindSwipe(); fitGreet(); fitAgenda(); afterView(r, changed); dockAuto();
}
function onData(){
  if (!S.ready) return;
  if (!S.settings){ showOnboarding(); return; }
  const ae = document.activeElement;
  const typing = ae && $("#view").contains(ae) && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA") && ae.value;
  if (!typing) render();
  if (S.sheetRefresh) S.sheetRefresh();
}

function dockAuto(){
  const r = currentRoute(), s = r.startsWith("s-") ? secById(r.slice(2)) : null, on = !!(s && MEDIA_CFG[s.tpl]) && !layerOpen();

  const end = vh + (window.scrollY || se.scrollTop || 0) >= se.scrollHeight - 40;
  document.body.classList.toggle("dock-hide", on && !end);
}

function fitAgenda(){
  const ag = $(".home-v .agenda"); if (!ag) return;
  const blocks = $$(".ag-block", ag).map(b => ({b, rows:$$(".ag-list > .row-it, .ag-list > .it, .ag-list > .group-t", b), more:$(".more-btn", b), def:$(".def-lnk", b)}));
  blocks.forEach(x => { x.rows.forEach(r => r.hidden = false); x.more.hidden = true; x.def.hidden = false; });
  const over = () => ag.scrollHeight > ag.clientHeight + 1;
  const vis = x => x.rows.filter(r => !r.hidden && !r.classList.contains("group-t")).length;
  const [today, free] = blocks;
  const trim = x => { const shown = x.rows.filter(r => !r.hidden); if (!shown.length) return false; shown[shown.length - 1].hidden = true; return true; };
  let guard = 0;
  while (over() && guard++ < 80){
    if (today && vis(today) > 2 && trim(today)) continue;
    if (free && vis(free) > 1 && trim(free)) continue;
    if (today && vis(today) > 1 && trim(today)) continue;
    if (free && vis(free) > 0 && trim(free)) continue;
    if (!(today && trim(today))) break;
  }
  blocks.forEach(x => {
    const shown = x.rows.filter(r => !r.hidden); if (shown.length && shown[shown.length - 1].classList.contains("group-t")) shown[shown.length - 1].hidden = true;
    const h = x.rows.filter(r => r.hidden && !r.classList.contains("group-t")).length;

  });
}

function openLayer(html, {kind="sheet", onMount, refresh} = {}){
  const L = $("#layer");
  L.innerHTML = kind === "drawer"
    ? `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Menú">${html}</aside>`
    : `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab-zone"><div class="grab"></div></div>${html}</div>`;
  S.sheetRefresh = refresh || null;
  requestAnimationFrame(() => requestAnimationFrame(() => L.classList.add("open")));
  const panel = L.lastElementChild, isD = kind === "drawer";
  const zone = isD ? panel : $(".grab-zone", panel);
  let s0 = null, o0 = 0, d = 0, lock = null;
  zone.addEventListener("pointerdown", e => { if (isD && e.pointerType === "mouse") return; s0 = isD ? e.clientX : e.clientY; o0 = isD ? e.clientY : e.clientX; d = 0; lock = isD ? null : "main"; });
  zone.addEventListener("pointermove", e => {
    if (s0 === null) return;
    const raw = (isD ? e.clientX : e.clientY) - s0, other = (isD ? e.clientY : e.clientX) - o0;
    if (lock === null && (Math.abs(raw) > 8 || Math.abs(other) > 8)) lock = Math.abs(raw) > Math.abs(other) ? "main" : "other";
    if (lock !== "main") return;
    d = isD ? Math.min(0, raw) : Math.max(0, raw);
    panel.style.transition = "none";
    panel.style.setProperty(isD ? "--dragx" : "--drag", d + "px");
  });
  const end = () => { if (s0 === null) return; s0 = null; panel.style.transition = ""; if (Math.abs(d) > 90) closeLayer(); else panel.style.setProperty(isD ? "--dragx" : "--drag", "0px"); };
  zone.addEventListener("pointerup", end); zone.addEventListener("pointercancel", end);
  if (onMount) onMount(panel);
  if (!isD){ const first = $("input[type=text],input[type=search],textarea", panel); if (first && window.matchMedia("(min-width:700px)").matches) setTimeout(() => first.focus(), 60); }
}
function closeLayer(){
  const L = $("#layer"); if (!L.classList.contains("open")) return;
  L.classList.remove("open"); S.sheetRefresh = null;
  setTimeout(() => { if (!L.classList.contains("open")) L.innerHTML = ""; }, 450);
}
const layerOpen = () => $("#layer").classList.contains("open");

const norm = t => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

async function hashPin(pin, salt){
  const data = new TextEncoder().encode(salt + ":" + pin);
  try { const h = await crypto.subtle.digest("SHA-256", data); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join(""); }
  catch { let h = 0; for (const c of salt + pin) h = (h * 31 + c.charCodeAt(0)) | 0; return "f" + h; }
}

function pinInput(root, onDone){
  let v = "";

  const draw = () => $$("i", dots).forEach((d, i) => d.classList.toggle("on", i < v.length));
  const press = k => {
    if (k === "del") v = v.slice(0, -1); else if (k !== "" && v.length < 4) v += k;
    draw(); buzz();
    if (v.length === 4){ const val = v; setTimeout(() => { v = ""; draw(); onDone(val, () => { dots.classList.remove("bad"); void dots.offsetWidth; dots.classList.add("bad"); }); }, 120); }
  };
  root.addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b){ e.stopPropagation(); press(b.dataset.k); } });
  root._key = e => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === "Backspace") press("del"); };

async function geminiCall(tries=0){
  let res, data;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 40000);
  try {
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEM_MODELS[gemIdx]}:generateContent`, {method:"POST", signal:ctl.signal, headers:{"content-type":"application/json", "x-goog-api-key":provKey("gemini")},
      body:JSON.stringify({systemInstruction:{parts:[{text:aiSystem()}]}, contents:AI.gHist, tools:GEM_TOOLS, generationConfig:{maxOutputTokens:8000}})});
    data = await res.json().catch(() => ({}));
  } catch (e){
    clearTimeout(timer);
    if (ctl.signal.aborted && tries < 3){ gemIdx = (gemIdx + 1) % GEM_MODELS.length; return geminiCall(tries + 1); }
    throw {code:ctl.signal.aborted ? "slow" : "net"};
  }
  clearTimeout(timer);
  if (res.status === 404 && gemIdx < GEM_MODELS.length - 1){ gemIdx++; return geminiCall(tries); }
  if ((res.status === 503 || res.status === 500) && tries < 4){
    gemIdx = (gemIdx + 1) % GEM_MODELS.length;
    await new Promise(r => setTimeout(r, 600 + tries * 600));
    return geminiCall(tries + 1);
  }
  if (!res.ok) throw {status:res.status, message:data?.error?.message || "", gemini:true};
  return data;
}
async function geminiSend(){
  let goto = null;
  for (let step = 0; step < 8; step++){
    const data = await geminiCall();
    const cand = data.candidates?.[0];
    if (!cand || !cand.content){ AI.view.push({r:"err", t:data.promptFeedback?.blockReason ? "El asistente no puede ayudar con esto." : "No he recibido respuesta. Prueba otra vez."}); break; }
    const parts = cand.content.parts || [];
    AI.gHist.push({role:"model", parts});
    const txt = parts.filter(p => p.text && !p.thought).map(p => p.text).join("\n").trim();
    if (txt) AI.view.push({r:"a", t:txt});
    const calls = parts.filter(p => p.functionCall);
    if (!calls.length){ if (cand.finishReason === "MAX_TOKENS") AI.view.push({r:"err", t:"La respuesta se ha cortado por larga."}); break; }
    const resp = [];
    for (const c of calls){
      let out;
      try { out = runTool(c.functionCall.name, c.functionCall.args || {}); } catch (err){ out = {error:String(err && err.message || err)}; }
      if (out._act) AI.view.push({r:"act", t:"✓ " + out._act});
      if (out._goto) goto = out._goto;
      const {_act, _goto, ...pub} = out;
      resp.push({functionResponse:{name:c.functionCall.name, response:pub}});
    }
    AI.gHist.push({role:"user", parts:resp});
    drawChat();
  }
  return goto;
}
function aiErrorText(e){
  if (e && e.code === "nosdk") return "No se pudo cargar el asistente. Comprueba tu conexión.";
  if (e && e.code === "net") return "No he podido conectar con el asistente. Comprueba tu conexión.";
  if (e && e.code === "slow") return "Gemini está tardando demasiado (suele pasar cuando está saturado). Prueba otra vez en un momento.";
  if (e && e.gemini){
    const st = e.status, m = String(e.message);
    if (st === 400 && /api key|API_KEY/i.test(m) || st === 401 || st === 403) return "La clave de Gemini no es válida. Revísala en Perfil y ajustes.";
    if (st === 429) return "Has llegado al límite gratuito de Gemini por ahora. Espera un rato y vuelve a probar.";
    if (st >= 500) return "Gemini está saturado ahora mismo. Inténtalo de nuevo en unos minutos.";
    return "Gemini ha devuelto un error: " + m.slice(0, 160);
  }
  const st = e && e.status;
  if (st === 401) return "La clave de Claude no es válida. Revísala en Perfil y ajustes.";
  if (st === 403) return "Tu clave no tiene permiso para usar este modelo.";
  if (st === 429) return "Demasiadas peticiones seguidas. Espera un momento y vuelve a probar.";
  if (st === 400 && /credit|billing|balance/i.test(String(e.message))) return "Tu cuenta de Anthropic no tiene saldo. Añade crédito en console.anthropic.com.";
  if (st >= 500) return "El servicio de Claude no responde ahora mismo. Inténtalo en unos minutos.";
  return "No he podido conectar con el asistente. Comprueba tu conexión.";
}
async function aiSend(text){
  if (AI.busy || !text.trim()) return;
  AI.busy = true;
  AI.view.push({r:"u", t:text}); drawChat();
  let goto = null;
  if (aiProv() === "gemini"){
    AI.gHist.push({role:"user", parts:[{text}]});
    try { goto = await geminiSend(); }
    catch (e){ AI.view.push({r:"err", t:aiErrorText(e)}); const last = AI.gHist[AI.gHist.length - 1]; if (last && last.role === "user" && last.parts[0]?.text) AI.gHist.pop(); }
    AI.busy = false; drawChat();
    if (goto){ AI.view.push({r:"act", t:"", goto}); drawChat(); }
    return;
  }
  AI.history.push({role:"user", content:text});
  try {
    let client;
    try { client = await getClient(); } catch { throw {code:"nosdk"}; }
    for (let step = 0; step < 8; step++){
      const res = await callModel(client);
      AI.history.push({role:"assistant", content:res.content});
      const txt = res.content.filter(b => b.type === "text").map(b => b.text).join("\n").trim();
      if (txt) AI.view.push({r:"a", t:txt});
      if (res.stop_reason === "refusal"){ AI.view.push({r:"err", t:"El asistente no puede ayudar con esto."}); break; }
      if (res.stop_reason === "pause_turn"){ drawChat(); continue; }
      if (res.stop_reason !== "tool_use"){ if (res.stop_reason === "max_tokens") AI.view.push({r:"err", t:"La respuesta se ha cortado por larga."}); break; }
      const results = [];
      for (const b of res.content.filter(b => b.type === "tool_use")){
        let out;
        try { out = runTool(b.name, b.input || {}); } catch (err){ out = {error:String(err && err.message || err)}; }
        if (out._act) AI.view.push({r:"act", t:"✓ " + out._act});
        if (out._goto) goto = out._goto;
        const {_act, _goto, ...pub} = out;
        results.push({type:"tool_result", tool_use_id:b.id, content:JSON.stringify(pub), ...(pub.error ? {is_error:true} : {})});
      }
      AI.history.push({role:"user", content:results});
      drawChat();
    }
  } catch (e){
    AI.view.push({r:"err", t:aiErrorText(e)});
    const last = AI.history[AI.history.length - 1];
    if (last && last.role === "user" && typeof last.content === "string") AI.history.pop();
  }
  AI.busy = false; drawChat();
  if (goto){ AI.view.push({r:"act", t:"", goto}); drawChat(); }
}

  const box = $("#chat"); if (!box) return;
  const sugg = ["¿Qué tengo esta semana?", "Planifícame el día de hoy", "Crea una sección de artes marciales con horarios y progreso", "Apúntame ir al gimnasio lunes, miércoles y viernes a las 19:00"];

    if (k === "note"){ it.body = fd.get("body") || ""; it.pinned = !!fd.get("pinned"); if (!it.title && !it.body.trim()) return closeLayer(); }

      else if (fl.type === "number") fields[fl.key] = v === "" || v === null ? "" : +v;
      else if (fl.type === "photos" || fl.type === "garments"){ try { fields[fl.key] = JSON.parse(v || "[]"); } catch { fields[fl.key] = []; } }
      else fields[fl.key] = (v || "").trim();
    }
    let title = (fd.get("title") || "").trim(); if (kd && kd.autoTitle) title = kd.autoTitle(fields, s) || title; if (!title) return;

  let x0 = null, y0 = 0;
  g.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; });
  g.addEventListener("pointerup", e => { if (x0 === null) return; const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) moveMonth(dx < 0 ? 1 : -1); });
}

addEventListener("pointermove", e => { if (fine.matches) tilt(e.clientX / innerWidth - .5, e.clientY / innerHeight - .5); }, {passive:true});
addEventListener("deviceorientation", e => { if (e.gamma == null) return; tilt(Math.max(-.5, Math.min(.5, e.gamma / 70)), Math.max(-.5, Math.min(.5, (e.beta - 45) / 90))); }, {passive:true});

function checkAlerts(){
  if (!S.ready || !S.settings || S.locked) return;
  const now = Date.now(), tk = todayKey(), due = [];
  for (const r of ofKind("reminder")){
    if (r.done || !r.date || !r.time) continue;
    const at = parseYmd(r.date).getTime() + (+r.time.slice(0, 2))*36e5 + (+r.time.slice(3, 5))*6e4, key = `r:${r.id}:${r.date}T${r.time}`;
    if (at <= now && now - at < 12*36e5 && !fired.has(key)) due.push({key, it:r, title:r.title, text:`Aviso · ${r.time}`});
  }
  for (const e of ofKind("event")){
    if (e.alert === "" || e.alert == null || !e.time) continue;

    else if (x0 !== null || e.pointerType === "mouse") tiltTo((e.clientX - b.width / 2) / (b.width / 2), (e.clientY - b.height / 2) / (b.height / 2));
  });
  const up = () => { x0 = null; card.style.transition = ""; if (imgs.length > 1){ ry = 0; rx = 0; paint(); } };
  card.addEventListener("pointerup", up); card.addEventListener("pointercancel", up);
  el.addEventListener("wheel", e => { e.preventDefault(); zoom = Math.max(1, Math.min(3, zoom - e.deltaY / 400)); paint(); }, {passive:false});
  const ori = e => { if (e.gamma == null || x0 !== null) return; tiltTo(Math.max(-1, Math.min(1, e.gamma / 35)), Math.max(-1, Math.min(1, (e.beta - 45) / 40))); };

  const esck = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", esck);

function nutriGoal(s){
  const g = s.goal || {};
  if (!(+g.peso && +g.altura && +g.edad)) return {kcal:2000, prot:75, carb:250, grasa:65, azucar:50, fibra:28, set:false};
  const bmr = 10 * g.peso + 6.25 * g.altura - 5 * g.edad + (g.sexo === "Mujer" ? -161 : 5);
  let kcal = bmr * ({Poca:1.25, Media:1.45, Mucha:1.7}[g.actividad] || 1.45);
  kcal += {bajar:-400, subir:300}[g.objetivo] || 0;
  const prot = g.peso * ({bajar:2, subir:1.8}[g.objetivo] || 1.6), grasa = kcal * .28 / 9;
  return {kcal:Math.round(kcal), prot:Math.round(prot), grasa:Math.round(grasa), carb:Math.max(0, Math.round((kcal - prot * 4 - grasa * 9) / 4)), azucar:Math.round(kcal * .1 / 4), fibra:g.sexo === "Mujer" ? 25 : 30, set:true};
}

function nutTips(t, g, ms){
  const out = [];

  if (!t.kcal && !t.prot) out.push("Toca «Calcular nutrientes con IA» al apuntar un plato y verás sus valores.");
  else {
    if (t.prot < g.prot * .7) out.push(`Te faltan unos ${g.prot - t.prot} g de proteína: huevos, pollo, pescado, legumbres o yogur griego.`);
    if (t.azucar > g.azucar) out.push(`Vas pasado de azúcar (${t.azucar} g de ${g.azucar} g). Mejor fruta entera que dulces.`);
    if (t.fibra < g.fibra * .5) out.push("Poca fibra hoy: añade verdura, fruta, legumbres o pan integral.");
    if (t.kcal > g.kcal * 1.1) out.push(`Llevas ${t.kcal - g.kcal} kcal por encima de tu objetivo.`);

}

function coverflow(rail){
  if (rail.classList.contains("dragging")) return;
  if (rail.classList.contains("sorting")){ for (const hg of rail.children) if (hg.classList.contains("hg")){ hg.style.transform = ""; hg.style.opacity = ""; hg.style.zIndex = ""; } return; }
  const r = rail.getBoundingClientRect(), cx = r.left + r.width / 2;
  for (const h of rail.children){

/* ---------- migration to kits ---------- */
function normalizeKits(){
  if (!S.settings) return;
  let ch = false;
  S.settings.sections = sections().map(x => {
    let y = x; const kit = KITS[x.tpl];
    if (kit && x.kitv !== KIT_V){ y = {...y, fields:kit.kinds[kit.def].fields, kitv:KIT_V, statusKey:"", dateKey:"", timeKey:"", repeatKey:"", calendar:false}; if (kit.rename && kit.rename[0].test(y.name)) y.name = kit.rename[1]; ch = true; }
    if (x.tpl === "outfits" && !x.hidden){ y = {...y, hidden:true, calendar:true, dateKey:"fecha"}; ch = true; }
    return y;
  });
  let n = 0;
  for (const e of ofKind("entry")){
    const s = secById(e.sectionId), kit = s && KITS[s.tpl];
    if (!kit || (e.sub && kit.kinds[e.sub])) continue;
    const r = kit.migrate ? kit.migrate(e, s) : {sub:kit.def};
    putItem({...e, sub:r.sub, fields:{...(e.fields || {}), ...(r.fields || {})}}, true); n++;
  }
  for (const x of sections()) if (x.tpl === "armario" && !x.fields.some(f => f.key === "cajon")){ const i = x.fields.findIndex(f => f.key === "categoria"); x.fields.splice(i + 1, 0, {key:"cajon", label:"Sitio en el cajón (accesorios)", type:"select", options:["Relojes","Gafas","Joyas","Neceseres","Bolsos","Otros"]}); ch = true; }
  if (!S.settings.cleanup3){
    const gone = sections().filter(x => x.tpl === "musica").flatMap(x => [x.id, ...descendants(x.id).map(c => c.id)]);
    for (const e of ofKind("entry").filter(e => gone.includes(e.sectionId))) delItem(e.id, true);
    S.settings.sections = sections().filter(x => !gone.includes(x.id)); S.settings.cleanup3 = true; ch = true; n++;
  }
  if (!S.settings.cleanup2){
    const gone = sections().filter(x => x.tpl === "videos" || /^v[ií]deos$/i.test(x.name)).flatMap(x => [x.id, ...descendants(x.id).map(c => c.id)]);
    for (const e of ofKind("entry").filter(e => gone.includes(e.sectionId))) delItem(e.id, true);
    S.settings.sections = sections().filter(x => !gone.includes(x.id)); S.settings.cleanup2 = true; ch = true; n++;
  }
  if (ch) putSettings(true);
  if (n) flushBulk();
}

  if (/top|mejor|favorit|ranking/.test(t)) add("top", {n:/\b10\b|diez/.test(t) ? 10 : /\b3\b|tres/.test(t) ? 3 : 5, perCat:!!mods.cats});

  if (/gast|dinero|ahorr|precio|presupuest|compra/.test(t)) add("dinero", {moneda:"€", meta:""});
  if (/h[aá]bito|racha|diari|cada d[ií]a|medita|beber|regar/.test(t)) add("racha");
  if (/viaj|lugar|restaur|sitio|ruta|concierto/.test(t)){ add("lugar"); add("fotos"); }
  if (/juego|jug/.test(t)) add("estados", {opts:"Quiero jugar, Jugando, Terminado"});
  else if (/leer|libro|c[oó]mic/.test(t)) add("estados", {opts:"Por leer, Leyendo, Leído"});
  else if (/escuch|disco|m[uú]sic|canci/.test(t)) add("estados", {opts:"Por escuchar, Escuchando, Escuchado"});
  else if (/\bver\b|serie|anime|pel[ií]/.test(t)) add("estados", {opts:"Quiero ver, Viendo, Visto"});

  return {mods, name, icon:icon ? icon[1] : "star"};
}

  return out.filter(x => x.title).map((x, i) => ({x, i, s:score(x)})).sort((a, b) => b.s - a.s || a.i - b.i).map(o => o.x).filter(x => { const k = deacc(x.title.toLowerCase()).replace(/[^a-z0-9]/g, "") + "|" + x.tipo + "|" + (x.year || ""); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 24);
}
async function seriesCreator(id){ try { const crew = await getJSON(`https://api.tvmaze.com/shows/${id}/crew`); return crew.filter(c => /creator/i.test(c.type)).map(c => c.person?.name).filter(Boolean).slice(0, 2).join(", "); } catch { return ""; } }

/* ---------- search box inside the add form ---------- */

async function mqPrefill(s, r){
  const c = MEDIA_CFG[s.tpl], f = {estado:c.st[0], tipo:r.tipo, anio:r.year ? +r.year : "", cover:r.cover || "", notas:(r.sinopsis || "").slice(0, 600)};

}
Object.assign(ACT, {

/* ---------- covers for genre tiles ---------- */
const GENRE_WIKI = {Acción:["Mad Max: Fury Road","John Wick","Die Hard"], Aventura:["Raiders of the Lost Ark","Pirates of the Caribbean: The Curse of the Black Pearl","Jurassic Park (film)"], Comedia:["The Hangover","Superbad (film)","The Grand Budapest Hotel"], Drama:["The Shawshank Redemption","Forrest Gump","Whiplash (2014 film)"], Terror:["The Conjuring","The Shining (film)","It (2017 film)"], Suspense:["Seven (1995 film)","Gone Girl (film)","Shutter Island (film)"], "Ciencia ficción":["Interstellar (film)","Blade Runner 2049","The Matrix"], Fantasía:["The Lord of the Rings: The Fellowship of the Ring","Harry Potter and the Philosopher's Stone (film)","Pan's Labyrinth"], Romance:["Titanic (1997 film)","The Notebook","Pride & Prejudice (2005 film)"], Animación:["Toy Story","Spirited Away","Coco (2017 film)"], Crimen:["The Godfather","Pulp Fiction","Goodfellas"], Documental:["March of the Penguins","Free Solo","Super Size Me"], Histórica:["Gladiator (2000 film)","Braveheart","Schindler's List"], Musical:["La La Land","The Greatest Showman","Mamma Mia! (film)"], Bélica:["Saving Private Ryan","1917 (2019 film)","Dunkirk (2017 film)"], Familiar:["Home Alone","Paddington (film)","Finding Nemo"], Superhéroes:["The Dark Knight","Avengers: Endgame","Spider-Man: Into the Spider-Verse"], Western:["The Good, the Bad and the Ugly","Django Unchained","Unforgiven"]};
async function wikiPosters(){
  const all = Object.values(GENRE_WIKI).flat(), out = {};
  for (let i = 0; i < all.length; i += 45){
    const d = await getJSON(`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=500&pilicense=any&pilimit=50&titles=${encodeURIComponent(all.slice(i, i + 45).join("|"))}`, 15000);
    const q = d.query || {}, map = {};
    for (const n of (q.normalized || [])) map[n.from] = n.to;
    for (const r of (q.redirects || [])) map[r.from] = r.to;
    const byT = {}; for (const pg of Object.values(q.pages || {})) if (pg.thumbnail) byT[pg.title] = pg.thumbnail.source;
    for (const t of all.slice(i, i + 45)){ let k = t; for (let n = 0; n < 3 && map[k]; n++) k = map[k]; if (byT[k]) out[t] = byT[k]; }
  }
  return out;
}
const GENRE_SEEDS = {Acción:"Mad Max", Aventura:"Indiana Jones", Comedia:"Resacón en Las Vegas", Drama:"Cadena perpetua", Terror:"Expediente Warren", Suspense:"Seven", "Ciencia ficción":"Interstellar", Fantasía:"El señor de los anillos", Romance:"Titanic", Animación:"Toy Story", Crimen:"El padrino", Documental:"documental naturaleza", Histórica:"Gladiator", Musical:"La La Land", Bélica:"Salvar al soldado Ryan", Familiar:"Solo en casa", Superhéroes:"Vengadores", Western:"El bueno, el feo y el malo"};
const GENRE_SUBJ = {Novela:"fiction", Fantasía:"fantasy", "Ciencia ficción":"science_fiction", Thriller:"thriller", Romance:"romance", Terror:"horror", Historia:"history", Biografías:"biography", "Desarrollo personal":"self-help", Psicología:"psychology", "Negocios y dinero":"business", Ciencia:"science", Filosofía:"philosophy", Tecnología:"technology", "True crime":"true_crime", Humor:"humor", Cómic:"comics", Poesía:"poetry"};
S.gimg = lsGet("orbita.gimg", {});
let gimgBusy = false;
async function loadGenreImages(tpl){
  if (gimgBusy) return; gimgBusy = true;
  const c = MEDIA_CFG[tpl], todo = c.genres.filter(g => !S.gimg[tpl + ":" + g]);
  if (tpl === "peliculas" && todo.length){
    try {
      const posters = await wikiPosters();
      for (const g of todo){ const urls = (GENRE_WIKI[g] || []).map(t => posters[t]).filter(Boolean); if (urls.length){ S.gimg[tpl + ":" + g] = urls; $$(`.gq[data-g="${CSS.escape(g)}"]`).forEach(b => paintGenre(b, urls)); } }
      lsSet("orbita.gimg", S.gimg);
    } catch {}
  }
  for (const g of c.genres.filter(g => !S.gimg[tpl + ":" + g])){
    try {
      let urls = [];
      if (tpl === "peliculas"){ const rs = await itunes(GENRE_SEEDS[g] || g, "movie", "movie", 6); urls = rs.map(r => bigArt(r.artworkUrl100)).filter(Boolean).slice(0, 3); }
      else { const d = await getJSON(`https://openlibrary.org/subjects/${GENRE_SUBJ[g] || "fiction"}.json?limit=6`); urls = (d.works || []).filter(w => w.cover_id).map(w => `https://covers.openlibrary.org/b/id/${w.cover_id}-M.jpg`).slice(0, 3); }
      if (urls.length){ S.gimg[tpl + ":" + g] = urls; lsSet("orbita.gimg", S.gimg); $$(`.gq[data-g="${CSS.escape(g)}"]`).forEach(b => paintGenre(b, urls)); }
    } catch {}
  }
  gimgBusy = false;
}
function paintGenre(b, urls){ if (b.querySelector(".gq-bg")) return; b.insertAdjacentHTML("afterbegin", `<span class="gq-bg" aria-hidden="true">${urls.slice(0, 1).map(u => `<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer">`).join("")}</span>`); b.classList.add("pic"); }
new MutationObserver(() => {
  const grid = $(".genres[data-tpl]"); if (!grid || grid.dataset.gi) return; grid.dataset.gi = "1";
  const tpl = grid.dataset.tpl;
  $$(".gq", grid).forEach(b => { const own = b.dataset.own ? JSON.parse(b.dataset.own) : []; const urls = own.length ? own : S.gimg[tpl + ":" + b.dataset.g]; if (urls && urls.length) paintGenre(b, urls); });
  loadGenreImages(tpl);
  enrichMedia(tpl);
}).observe(document.body, {childList:true, subtree:true});

/* ---------- fill cover, year and director for titles saved without them ---------- */
let enrichBusy = false; const enrichTried = new Set();
async function enrichMedia(tpl){
  if (enrichBusy || !navigator.onLine) return; enrichBusy = true;
  const s = sections().find(x => x.tpl === tpl);
  const list = s ? entriesOf(s.id).filter(e => !e.enr && !enrichTried.has(e.id) && !(e.fields?.portada || []).length && !e.fields?.cover).slice(0, 12) : [];
  let changed = 0;
  for (const e of list){
    enrichTried.add(e.id);
    await new Promise(r => setTimeout(r, 700));
    try {
      const rs = await searchOnline(tpl, e.title, e.fields?.tipo || "");
      if (!rs.length) continue;
      const t = e.title.toLowerCase(), r = rs.find(x => x.title.toLowerCase() === t && (!e.fields?.tipo || x.tipo === e.fields.tipo)) || rs.find(x => x.title.toLowerCase().startsWith(t) && (!e.fields?.tipo || x.tipo === e.fields.tipo));
      const cur = S.items.get(e.id); if (!cur) continue;
      const f = {...(cur.fields || {})};
      if (r){
        if (!f.cover && r.cover) f.cover = r.cover;
        if (!f.anio && r.year) f.anio = +r.year;
        if (tpl === "peliculas"){ let who = r.director; if (!who && r.src === "tm" && r.id) who = await seriesCreator(r.id); if (!f.director && who) f.director = who; }
        else if (!f.autor && r.director) f.autor = r.director;
        if (!f.genero && r.genero) f.genero = r.genero;
        if (!f.tipo && r.tipo) f.tipo = r.tipo;
      }
      putItem({...cur, fields:f, enr:1}, true); changed++;
    } catch {}
  }
  if (changed) flushBulk();
  enrichBusy = false;
}

(async function boot(){
  const t0 = Date.now();
  await initStore();
  if (S.settings && !S.settings.profile) S.settings.profile = {name:S.settings.name || ""};
  if (S.settings && !S.settings.sections) S.settings.sections = [];
  if (S.settings){
    let ch = false;
    S.settings.sections = S.settings.sections.map(x => {
      if (x.tpl === "armario" && !x.fields.some(f => f.type === "photos")){ ch = true; return {...x, fields:[{key:"fotos", label:"Fotos", type:"photos"}, ...x.fields]}; }
      if (x.tpl === "outfits" && !x.fields.some(f => f.type === "garments")){ ch = true; const fields = [...x.fields]; fields.splice(1, 0, {key:"prendas_ids", label:"Prendas del armario", type:"garments"}, {key:"fotos", label:"Foto del outfit", type:"photos"}); return {...x, name:x.name === "Outfits" ? "Calendario de outfits" : x.name, fields}; }
      return x;
    });
    if (ch) putSettings(true);
  }
  if (S.settings && S.settings.sections.some(x => x.tpl === "entrenos" && /^(Entrenamiento|Entrenos)$/.test(x.name))){
    S.settings.sections = S.settings.sections.map(x => x.tpl === "entrenos" && /^(Entrenamiento|Entrenos)$/.test(x.name) ? {...x, name:"Entrenamientos"} : x); putSettings(true);
  }
  normalizeKits();
  if (S.settings && !S.settings.cleanup1){
    const gone = sections().filter(x => ["proyectos","guardados"].includes(x.tpl) || /^(Proyectos|Guardados)$/.test(x.name)).flatMap(x => [x.id, ...descendants(x.id).map(c => c.id)]);
    for (const e of ofKind("entry").filter(e => gone.includes(e.sectionId))) delItem(e.id, true);
    S.settings.sections = sections().filter(x => !gone.includes(x.id)); S.settings.cleanup1 = true; putSettings(true); flushBulk();
  }
  S.ready = true;
  if (!S.settings) showOnboarding();
  else if (S.settings.pin) showLock();
  else { render(); checkAlerts(); }
  const wait = Math.max(0, (reduce.matches ? 200 : 1300) - (Date.now() - t0));
  setTimeout(() => { const sp = $("#splash"); sp.classList.add("out"); setTimeout(() => sp.remove(), 500); fitGreet(); }, wait);
  if (!window.claude && "serviceWorker" in navigator && location.protocol === "https:"){
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg => { reg.update().catch(() => {}); document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); }); }).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (reloaded || $(".sheet") || $(".onb")) return; reloaded = true; location.reload(); });
    const checkVersion = () => fetch("version.txt?t=" + Date.now(), {cache:"no-store"}).then(r => r.ok ? r.text() : "").then(v => { v = v.trim(); if (v && v !== APP_VERSION && !sessionStorage.getItem("orbita.reload." + v)){ sessionStorage.setItem("orbita.reload." + v, "1"); location.reload(); } }).catch(() => {});
    checkVersion(); document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
  }
})();
})();
