<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Órbita</title>
<meta name="description" content="Tu espacio personal: calendario, tareas, avisos, notas y secciones a tu medida.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Órbita">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap">
<style>
/* Layout: one white page, ink type, a single red for "today" and alerts. One-line greeting on top, a large month in the middle, today's list below, a three-button dock at the bottom. */
:root{
  --paper:#ffffff; --paper-2:#f4f4f3; --paper-3:#ebebe9;
  --line:#e7e6e3; --line-2:#d3d2ce;
  --ink:#0d0d0d; --ink-2:#3b3b39; --mute:#8a8985;
  --red:#e0141c; --red-soft:#fdeceb; --on-red:#ffffff;
  --f:"Archivo","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --r-lg:22px; --r-md:16px;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --foot:68px;
  color-scheme:light;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15.5px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

main{width:100%;max-width:1180px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:6px calc(var(--foot) + env(safe-area-inset-bottom,0px) + 28px);min-width:0}
.view{display:flex;flex-direction:column;gap:24px}
.view.enter{animation:viewIn .5s var(--ease)}
@keyframes viewIn{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

/* splash */
#splash{position:fixed;inset:0;z-index:90;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .45s var(--ease),transform .45s var(--ease)}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .logo{position:relative;width:96px;height:96px}
#splash .logo svg{width:96px;height:96px;transform:rotate(-90deg)}
#splash .logo circle{fill:none;stroke:var(--ink);stroke-width:13;stroke-dasharray:226;stroke-dashoffset:226;animation:ringDraw .9s .05s var(--ease) forwards;stroke-linecap:round}
#splash .logo i{position:absolute;right:2px;top:2px;width:24px;height:24px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px var(--paper);transform:scale(0);animation:dotPop .5s .75s var(--spring) forwards}
#splash b{font-weight:900;font-stretch:122%;font-size:30px;letter-spacing:-.035em;opacity:0;animation:fadeUp .6s .55s var(--ease) forwards}
#splash b em{font-style:normal;color:var(--red)}
@keyframes ringDraw{to{stroke-dashoffset:0}}
@keyframes dotPop{to{transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:10px;padding-block:10px;background:var(--paper)}
.top .ttl{text-align:center;font-weight:800;font-stretch:112%;font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13.5px;color:var(--mute);margin-top:-14px}
.crumb svg{width:16px;height:16px}
.ibtn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--ink);transition:background .2s,transform .15s var(--ease)}
.ibtn:hover{background:var(--paper-2)}
.ibtn:active{transform:scale(.9)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ink) center/cover no-repeat;color:var(--paper);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;overflow:hidden}

/* greeting */
.hello{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;grid-template-areas:"l e r" "g g g";align-items:center;row-gap:2px;column-gap:8px;padding-top:4px}
.hello > .ibtn:first-child{grid-area:l}.hello > .ibtn:last-child{grid-area:r}
.hello .mid{display:contents}
.hello .eyebrow{grid-area:e;text-align:center}
.hello .greet{grid-area:g;text-align:center}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:600}
.greet{margin:0;width:100%;white-space:nowrap;overflow:hidden;font-weight:900;font-stretch:84%;font-size:42px;line-height:1.08;letter-spacing:-.035em;perspective:600px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .6s var(--ease);padding-block:2px}
.greet .ch{display:inline-block;transform-origin:50% 100%;animation:chIn .7s var(--ease) both;animation-delay:calc(var(--i) * 22ms)}
.greet .sp{display:inline-block;width:.28em}
.greet .red{color:var(--red)}
@keyframes chIn{from{opacity:0;transform:translateY(.4em) rotateX(-80deg)}to{opacity:1;transform:none}}

.home{display:grid;gap:24px}
@media (min-width:900px){.home{grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start;gap:40px}}
body.static{position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none}
body.static main{padding-bottom:0}
.view.home-v{height:calc(100vh - var(--foot) - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px) - 8px);height:calc(100dvh - var(--foot) - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px) - 8px);gap:14px;overflow:hidden}
.home-v .home{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
.home-v .agenda{flex:1;min-height:0;overflow:hidden}
.home-v .d{aspect-ratio:auto;height:clamp(36px,calc((100dvh - 440px) / 6),62px)}
.more-btn{align-self:flex-start;margin-top:8px}
@media (min-width:900px){
  .home-v .home{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:40px;align-items:stretch}
  .home-v .cal{display:flex;flex-direction:column;min-height:0}
  .home-v .d{height:clamp(44px,calc((100dvh - 340px) / 6),104px)}
}

/* calendar */
.cal{width:calc(100% + 12px);margin-inline:-6px;touch-action:pan-y}
@media (min-width:900px){.cal{width:100%;margin-inline:0}}
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:12px;padding-inline:6px}
.cal-h .m{flex:1;font-weight:900;font-stretch:115%;font-size:clamp(1.6rem,6.4vw,2.4rem);letter-spacing:-.03em;text-transform:capitalize;line-height:1}
.cal-h .m span{color:var(--mute);font-weight:700}
.pillbtn{height:34px;padding:0 13px;border-radius:999px;border:1.5px solid var(--ink);font-weight:700;font-size:13px;transition:transform .15s var(--ease)}
.pillbtn:active{transform:scale(.94)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.grid7.next{animation:slideL .35s var(--ease)}
.grid7.prev{animation:slideR .35s var(--ease)}
@keyframes slideL{from{opacity:.2;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.2;transform:translateX(-28px)}to{opacity:1;transform:none}}
.wk{text-align:center;font-size:12px;letter-spacing:.14em;color:var(--mute);font-weight:700;padding-bottom:8px}
.d{aspect-ratio:1/1;max-width:100%;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-weight:750;font-size:clamp(18px,5.6vw,30px);letter-spacing:-.02em;transition:background .2s,transform .2s var(--spring),color .2s}
.d:hover{background:var(--paper-2)}
.d:active{transform:scale(.86)}
.d.out{color:#c8c7c3}
.d.wkend:not(.out):not(.today){color:var(--ink-2)}
.d.sel{box-shadow:inset 0 0 0 2.5px var(--ink)}
.d.sel.pop{animation:selPop .35s var(--spring)}
@keyframes selPop{from{transform:scale(.85)}to{transform:none}}
.d.today{background:var(--red);color:var(--on-red);font-weight:900;box-shadow:0 12px 26px -10px rgba(224,20,28,.8);animation:todayIn .7s .2s var(--spring) both}
.d.today.sel{box-shadow:0 12px 26px -10px rgba(224,20,28,.8),inset 0 0 0 2.5px rgba(255,255,255,.65)}
@keyframes todayIn{from{transform:scale(.6);opacity:.2}to{transform:none;opacity:1}}
.d .pip{display:flex;gap:3px;height:5px;position:absolute;bottom:13%}
.d .pip i{width:5px;height:5px;border-radius:50%;background:var(--ink)}
.d .pip i.r{background:var(--red)}
.d.today .pip i{background:var(--on-red)}

/* agenda */
.agenda{display:flex;flex-direction:column;gap:4px;min-width:0}
.sec-t{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.sec-t h2{margin:0;font-weight:900;font-stretch:115%;font-size:clamp(1.45rem,5vw,1.9rem);letter-spacing:-.03em;line-height:1}
.sec-t .n{font-weight:700;color:var(--mute);font-size:15px}
.sec-t .sp{flex:1}
.lnk{font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
.lnk svg{width:16px;height:16px}
.row-it{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0;transition:background .2s;border-radius:6px}
.row-it:hover{background:var(--paper-2)}
.row-it:last-child{border-bottom:0}
.anim .row-it,.anim .it,.anim .entry,.anim .tile,.anim .note{animation:rowIn .45s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row-it .tm{font-weight:700;font-size:14px}
.row-it .tm.all{color:var(--mute);font-weight:600;font-size:12.5px}
.row-it .tt{font-weight:650;font-size:16px;line-height:1.25;overflow-wrap:anywhere;transition:color .3s}
.row-it .lb{font-size:12.5px;color:var(--mute);font-weight:500;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row-it.done .tt,.it.done .tt{text-decoration:line-through;color:var(--mute)}
.row-it.alert .tm{color:var(--red)}
.tag{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:999px;background:var(--paper-2);font-size:11.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.ex{background:transparent;border:1px dashed var(--line-2);color:var(--mute)}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;flex:none;transition:background .25s var(--ease),transform .25s var(--spring)}
.ck svg{width:15px;height:15px;stroke-width:3.2;stroke:var(--paper);opacity:0;transform:scale(.3);transition:all .3s var(--spring)}
.ck.on{background:var(--ink);transform:scale(1.08)}
.ck.on svg{opacity:1;transform:none}
.ck:active{transform:scale(.8)}
.empty{padding:18px;border-radius:var(--r-md);background:var(--paper-2);color:var(--ink-2);font-size:14.5px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty b{color:var(--ink);font-weight:800;font-size:15.5px}
.group-t{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--mute);padding:16px 4px 4px}
.group-t.red{color:var(--red)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:var(--foot);
  padding:6px max(18px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  background:var(--paper);border-top:1px solid var(--line);animation:footIn .5s .25s var(--ease) both}
@keyframes footIn{from{transform:translateY(100%)}to{transform:none}}
.dock:empty{display:none}
.dock .ft{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border-radius:14px;font-size:11.5px;font-weight:750;letter-spacing:.02em;color:var(--ink-2);transition:background .2s,transform .2s var(--spring)}
.dock .ft:hover{background:var(--paper-2)}
.dock .ft:active{transform:scale(.9)}
.dock .ft:first-child{justify-self:stretch}
.dock .ft:last-child{justify-self:stretch}
.dock .add{display:flex;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:16px;background:var(--ink);color:var(--paper);font-weight:800;font-size:14.5px;transition:transform .2s var(--spring)}
.dock .add:active{transform:scale(.92)}
.dock .add svg{width:22px;height:22px;stroke-width:2.4}
.dock .today-n{position:relative}
.dock .today-n .ic-wrap{position:relative;display:grid;place-items:center}
.dock .today-n b{position:absolute;top:55%;left:50%;transform:translate(-50%,-30%);font-size:9px;font-weight:900}
@media (min-width:900px){.dock{grid-template-columns:200px auto 200px;justify-content:center;gap:28px}}

/* search */
.s-group{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.s-group > .lbl{display:flex;justify-content:space-between;align-items:center}
.recent{display:flex;flex-wrap:wrap;gap:8px}
.recent .chip{padding-right:8px}
.recent .chip .x{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;margin-left:2px}
.recent .chip .x svg{width:14px;height:14px}
.sec-hit{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:14px;text-align:left;width:100%;transition:background .2s}
.sec-hit:hover{background:var(--paper-2)}
.sec-hit .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ink);color:var(--paper);flex:none}
.sec-hit .tx{flex:1;min-width:0}
.sec-hit b{display:block;font-weight:800;font-size:15.5px}
.sec-hit span{font-size:12.5px;color:var(--mute)}
.mark{background:var(--red-soft);color:var(--red);border-radius:4px;padding:0 2px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:800;font-size:14.5px;background:var(--paper-2);transition:transform .15s var(--ease),background .2s;text-align:center}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);background:var(--red-soft)}
.btn.danger.armed{background:var(--red);color:var(--on-red)}
.btn.sm{min-height:38px;padding:0 14px;font-size:13.5px;border-radius:12px}
.btn.lg{min-height:56px;padding:0 28px;font-size:16px}
.btn svg{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field > label,.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:800}
.inp,.field input[type=text],.field input[type=url],.field input[type=number],.field input[type=date],.field input[type=time],.field input[type=password],.field select,.field textarea,.search-in{
  width:100%;min-height:50px;padding:12px 15px;border-radius:14px;background:var(--paper-2);border:1.5px solid transparent;outline:none;font-size:16px;transition:border-color .2s,background .2s}
.field textarea{min-height:110px;resize:vertical}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus,.search-in:focus{border-color:var(--ink);background:var(--paper)}
.title-in{font-weight:900!important;font-stretch:112%;font-size:26px!important;letter-spacing:-.02em;background:transparent!important;border:0!important;border-bottom:2px solid var(--line)!important;border-radius:0!important;padding-left:0!important}
.title-in:focus{border-bottom-color:var(--ink)!important}
.at{position:relative}
.at::before{content:"@";position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mute);font-weight:700;pointer-events:none}
.at input{padding-left:34px!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input,.stars input,.swatches input,.iconpick input{position:absolute;opacity:0;pointer-events:none}
.seg label{min-height:40px;padding:0 14px;border-radius:12px;background:var(--paper-2);display:inline-flex;align-items:center;font-size:14px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:all .2s var(--ease)}
.seg label:active{transform:scale(.95)}
.seg input:checked + label{background:var(--ink);color:var(--paper)}
.seg input:focus-visible + label{outline:2px solid var(--red);outline-offset:2px}
.stars{display:flex;gap:2px;align-items:center}
.stars label{cursor:pointer;color:var(--line-2);padding:3px;transition:transform .2s var(--spring)}
.stars label:active{transform:scale(1.25)}
.stars label svg{width:30px;height:30px;fill:currentColor;stroke:none}
.stars label.on{color:var(--ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:36px;height:36px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .2s}
.swatches input:checked + .sw{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink);transform:scale(1.05)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:8px 16px;border-radius:14px;background:var(--paper-2);cursor:pointer}
.toggle .sub{display:block;color:var(--mute);font-size:13px;font-weight:500}
.toggle input{appearance:none;-webkit-appearance:none;width:48px;height:30px;border-radius:999px;background:var(--line-2);position:relative;transition:background .25s;flex:none;cursor:pointer;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.toggle input:checked{background:var(--ink)}
.toggle input:checked::after{transform:translateX(18px)}
input[type=range]{width:100%;accent-color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--mute)}
.small{font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 15px;border-radius:999px;background:var(--paper-2);font-size:13.5px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:all .2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--paper)}
.chip .n{opacity:.6;font-size:12px}

.box{border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;background:var(--paper);min-width:0}
.list{display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:13px;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0;border-radius:6px;transition:background .2s}
.it:hover{background:var(--paper-2)}
.it:last-child{border-bottom:0}
.it .tx{flex:1;min-width:0}
.it .tt{font-weight:650;font-size:16px;overflow-wrap:anywhere}
.it .mt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:2px}
.it > svg{color:var(--mute)}
.addline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addline input[type=text]{flex:1;min-width:180px;min-height:50px;padding:12px 15px;border-radius:14px;background:var(--paper-2);border:1.5px solid transparent;outline:none;font-size:16px}
.addline input[type=text]:focus{border-color:var(--ink);background:var(--paper)}

function occursOn(ev, key){
  if (!ev.date) return false;
  if (!ev.repeat || ev.repeat === "none") return ev.date === key;
  if (key < ev.date) return false;
  const a = parseYmd(ev.date), b = parseYmd(key);
  if (ev.repeat === "weekly") return a.getDay() === b.getDay();
  if (ev.repeat === "monthly") return a.getDate() === b.getDate();
  if (ev.repeat === "yearly") return ev.date.slice(5) === key.slice(5);
  if (ev.repeat === "daily") return true;
  return false;
}
function nextOcc(ev, fromKey = todayKey()){
  if (!ev.repeat || ev.repeat === "none") return ev.date >= fromKey ? ev.date : null;
  let d = parseYmd(fromKey > ev.date ? fromKey : ev.date);
  for (let i = 0; i < 370; i++){ const k = ymd(d); if (occursOn(ev, k)) return k; d = addDays(d, 1); }

}

  morning:["Buenos días, {n}","¿Ya en pie, {n}?","Arriba, {n}. El día espera","Café, plan y a volar"],
  afternoon:["Buenas tardes, {n}","Tarde de las buenas, {n}","Media jornada. Vamos bien","Un último empujón, {n}"],
  night:["Buenas noches, {n}","{n}, ¿tú no duermes?","Planear de noche mola","Mañana lo bordas, {n}"],

function pickPhrase(next){
  const n = myName(), h = new Date().getHours(), wd = new Date().getDay();
  const bd = profile().birthday;
  if (!next && bd && bd.slice(5) === todayKey().slice(5)) return n ? "¡Feliz cumple, {n}!" : "¡Feliz cumpleaños!";
  let pool = [...PHRASES.any, ...(h >= 6 && h < 13 ? PHRASES.morning : h >= 13 && h < 21 ? PHRASES.afternoon : PHRASES.night), ...(PHRASES[wd] || [])];
  if (!n) pool = pool.filter(p => !p.includes("{n}"));
  const last = lsGet("orbita.lastGreet", "");
  const opts = pool.filter(p => p !== last && p !== S.greet);
  const p = opts[Math.floor(Math.random() * opts.length)] || pool[0];
  lsSet("orbita.lastGreet", p);
  return p;
}
function greetHtml(animate){

/* ================= layer ================= */
function openLayer(html, {kind="sheet", onMount, refresh} = {}){
  const L = $("#layer");
  L.innerHTML = kind === "drawer"
    ? `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Menú">${html}</aside>`
    : `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab-zone"><div class="grab"></div></div>${html}</div>`;
  S.sheetRefresh = refresh || null;
  requestAnimationFrame(() => requestAnimationFrame(() => L.classList.add("open")));
  const panel = L.lastElementChild, isD = kind === "drawer";
  const zone = isD ? panel : $(".grab-zone", panel);
  let s0 = null, o0 = 0, d = 0, lock = null;
  zone.addEventListener("pointerdown", e => { if (isD && e.pointerType === "mouse") return; s0 = isD ? e.clientX : e.clientY; o0 = isD ? e.clientY : e.clientX; d = 0; lock = isD ? null : "main"; });
  zone.addEventListener("pointermove", e => {
    if (s0 === null) return;
    const raw = (isD ? e.clientX : e.clientY) - s0, other = (isD ? e.clientY : e.clientX) - o0;
    if (lock === null && (Math.abs(raw) > 8 || Math.abs(other) > 8)) lock = Math.abs(raw) > Math.abs(other) ? "main" : "other";
    if (lock !== "main") return;
    d = isD ? Math.min(0, raw) : Math.max(0, raw);
    panel.style.transition = "none";
    panel.style.setProperty(isD ? "--dragx" : "--drag", d + "px");
  });
  const end = () => { if (s0 === null) return; s0 = null; panel.style.transition = ""; if (Math.abs(d) > 90) closeLayer(); else panel.style.setProperty(isD ? "--dragx" : "--drag", "0px"); };
  zone.addEventListener("pointerup", end); zone.addEventListener("pointercancel", end);
  if (onMount) onMount(panel);
  if (!isD){ const first = $("input[type=text],input[type=search],textarea", panel); if (first && window.matchMedia("(min-width:700px)").matches) setTimeout(() => first.focus(), 60); }
}
function closeLayer(){
  const L = $("#layer"); if (!L.classList.contains("open")) return;
  L.classList.remove("open"); S.sheetRefresh = null;
  setTimeout(() => { if (!L.classList.contains("open")) L.innerHTML = ""; }, 450);
}
const layerOpen = () => $("#layer").classList.contains("open");
function swapLayer(fn){ if (layerOpen()){ closeLayer(); setTimeout(fn, 300); } else fn(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLayer(); });

const RECENT_KEY = "orbita.recent";
const recents = () => lsGet(RECENT_KEY, []);
function addRecent(q){ q = q.trim(); if (q.length < 2) return; lsSet(RECENT_KEY, [q, ...recents().filter(x => x.toLowerCase() !== q.toLowerCase())].slice(0, 8)); }
const norm = t => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function hl(text, q){
  const t = String(text || ""); if (!q) return esc(t);
  const i = norm(t).indexOf(norm(q)); if (i < 0) return esc(t);
  return esc(t.slice(0, i)) + `<span class="mark">${esc(t.slice(i, i + q.length))}</span>` + esc(t.slice(i + q.length));
}
function openSearch(){
  openLayer(`${sheetHead("Buscar")}<input type="search" class="search-in" id="gsearch" placeholder="Busca una sección o algo que guardaste" autocomplete="off" aria-label="Buscar" enterkeyhint="search"><div id="gres"></div>`, {onMount(sh){
    const inp = $("#gsearch", sh), res = $("#gres", sh);
    const secRow = s => { const n = deepCount(s.id); return `<button class="sec-hit" data-go="s-${s.id}"><span class="ic">${ic(s.icon)}</span><span class="tx"><b>${hl(s.name, inp.value.trim())}</b><span>${s.parentId ? esc(secById(s.parentId)?.name || "") + " · " : ""}${n} ${n === 1 ? "entrada" : "entradas"}</span></span>${ic("right")}</button>`; };
    const quick = [["tareas","Tareas pendientes","task"],["avisos","Avisos y fechas","bell"],["notas","Notas","note"],["calendario","Calendario","cal"]];
    const run = () => {
      const q = inp.value.trim();
      if (!q){
        const rc = recents();
        res.innerHTML = `
          ${rc.length ? `<div class="s-group"><span class="lbl">Búsquedas recientes <button class="lnk" data-clear style="font-size:12px;letter-spacing:0;text-transform:none">Borrar</button></span><div class="recent">${rc.map((r, i) => `<span class="chip"><button data-q="${esc(r)}">${esc(r)}</button><button class="x" data-rm="${i}" aria-label="Quitar ${esc(r)}">${ic("x")}</button></span>`).join("")}</div></div>` : ""}
          <div class="s-group"><span class="lbl">Accesos directos</span><div class="chips" style="flex-wrap:wrap">${quick.map(([k, l, i]) => `<button class="chip" data-go="${k}">${ic(i)}${l}</button>`).join("")}</div></div>
          <div class="s-group"><span class="lbl">Tus secciones</span>${sections().length ? sections().map(secRow).join("") : `<p class="muted small" style="margin:0">Aún no tienes secciones.</p>`}</div>`;
        return;
      }
      const nq = norm(q);
      const secs = sections().filter(s => norm(s.name).includes(nq) || s.fields.some(f => norm(f.label).includes(nq)));
      const hits = all().filter(i => norm(JSON.stringify([i.title, i.body, i.notes, i.fields])).includes(nq)).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 40);
      const label = i => { const s = i.kind === "entry" ? secById(i.sectionId) : null; return s ? secPath(s) : (i.important ? "Fecha importante" : {task:"Tarea", event:"Evento", reminder:"Aviso", note:"Nota"}[i.kind]); };
      res.innerHTML = `
        ${secs.length ? `<div class="s-group"><span class="lbl">Secciones · ${secs.length}</span>${secs.map(secRow).join("")}</div>` : ""}
        ${hits.length ? `<div class="s-group"><span class="lbl">Guardado · ${hits.length}</span><div class="list">${hits.map(i => `<div class="it" data-hit="${i.id}"><div class="tx"><div class="tt">${hl(i.title || (i.body || "").slice(0, 60) || "Sin título", q)}</div><div class="mt">${esc(label(i) || "")}${i.date ? " · " + esc(relDay(i.date)) : ""}</div></div>${ic("right")}</div>`).join("")}</div></div>` : ""}

    };
    res.addEventListener("click", e => {
      const t = e.target.closest("[data-go],[data-hit],[data-q],[data-rm],[data-clear],[data-new]"); if (!t) return;
      e.stopPropagation();
      const q = inp.value.trim();
      if (t.dataset.q !== undefined){ inp.value = t.dataset.q; run(); inp.focus(); }
      else if (t.dataset.rm !== undefined){ const r = recents(); r.splice(+t.dataset.rm, 1); lsSet(RECENT_KEY, r); run(); }
      else if (t.hasAttribute("data-clear")){ lsSet(RECENT_KEY, []); run(); }
      else if (t.hasAttribute("data-new")){ swapLayer(() => openTemplates("")); }
      else if (t.dataset.go){ if (q) addRecent(q); closeLayer(); location.hash = t.dataset.go; }

    run(); setTimeout(() => inp.focus(), 80);
  }});
}
function openDay(key){

      <div class="sched" id="sched">${rows}</div>
      <p class="muted small" style="margin:14px 0 0">Toca una hora libre para añadir un evento.</p>`;
  };
  const place = (sh, keep) => {
    const isToday = cur === todayKey(), n = new Date();
    if (!keep){ const target = $("#hr-" + Math.max(0, (isToday ? n.getHours() : 8) - 1), sh); if (target) sh.scrollTop = target.offsetTop - 90; }

    refresh(){ const sh = $(".sheet"); if (sh && sh._day){ const y = sh.scrollTop; $("#dayw", sh).innerHTML = draw(); place(sh, true); sh.scrollTop = y; } }
  });
}

/* ================= photo ================= */
$("#photoFile").addEventListener("change", e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const S2 = 256, c = document.createElement("canvas"); c.width = c.height = S2;
    const x = c.getContext("2d"), m = Math.min(img.width, img.height);
    x.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S2, S2);
    URL.revokeObjectURL(url);
    const data = c.toDataURL("image/jpeg", .85);
    if (onbDraft){ onbDraft.photo = data; drawOnb(); return; }
    S.settings.profile = {...profile(), photo:data}; putSettings(true); render(); toast("Foto actualizada");
  };
  img.onerror = () => toast("No se pudo leer la imagen", "Prueba con otra foto (JPG o PNG).");
  img.src = url;
});

/* ================= PIN ================= */
async function hashPin(pin, salt){
  const data = new TextEncoder().encode(salt + ":" + pin);
  try { const h = await crypto.subtle.digest("SHA-256", data); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join(""); }
  catch { let h = 0; for (const c of salt + pin) h = (h * 31 + c.charCodeAt(0)) | 0; return "f" + h; }
}

function pinInput(root, onDone){

  const press = k => {

async function aiSend(text){

    let client;

      const res = await callModel(client);
      AI.history.push({role:"assistant", content:res.content});
      const txt = res.content.filter(b => b.type === "text").map(b => b.text).join("\n").trim();
      if (txt) AI.view.push({r:"a", t:txt});
      if (res.stop_reason === "refusal"){ AI.view.push({r:"err", t:"El asistente no puede ayudar con esto."}); break; }
      if (res.stop_reason === "pause_turn"){ drawChat(); continue; }
      if (res.stop_reason !== "tool_use"){ if (res.stop_reason === "max_tokens") AI.view.push({r:"err", t:"La respuesta se ha cortado por larga."}); break; }
      const results = [];

        try { out = runTool(b.name, b.input || {}); } catch (err){ out = {error:String(err && err.message || err)}; }
        if (out._act) AI.view.push({r:"act", t:"✓ " + out._act});
        if (out._goto) goto = out._goto;
        const {_act, _goto, ...pub} = out;
        results.push({type:"tool_result", tool_use_id:b.id, content:JSON.stringify(pub), ...(pub.error ? {is_error:true} : {})});
      }
      AI.history.push({role:"user", content:results});
      drawChat();
    }
  } catch (e){
    AI.view.push({r:"err", t:aiErrorText(e)});
    const last = AI.history[AI.history.length - 1];
    if (last && last.role === "user" && typeof last.content === "string") AI.history.pop();
  }

  if (goto){ AI.view.push({r:"act", t:"Abre el menú ☰ para verla, o toca aquí", goto}); drawChat(); }
}

    closeLayer(); toast("Guardado en " + s.name);
  } else if (kind === "profile"){
    S.settings.profile = {...profile(), name:(fd.get("name") || "").trim(), username:(fd.get("username") || "").trim().replace(/^@/, "").toLowerCase().replace(/[^a-z0-9._-]/g, ""), birthday:fd.get("birthday") || ""};
    putSettings(true); S.greet = null; render(); toast("Perfil guardado");
  } else if (kind === "ai"){
    const ta = $("#ai-in"); const t = ta.value; ta.value = ""; ta.style.height = "auto"; aiSend(t);
  } else if (kind === "ai-key"){
    const key = (fd.get("key") || "").trim();
    if (!/^sk-ant-/.test(key)){ toast("Esa clave no parece de Anthropic", "Empieza por «sk-ant-». Cópiala entera desde console.anthropic.com."); return; }
    try { localStorage.setItem(AI_KEY, key); } catch {}
    const after = f.dataset.after; closeLayer(); render(); toast("Asistente conectado"); setTimeout(() => openAI(after || ""), 320);
  } else if (kind === "sec-ai"){
    const t = (fd.get("text") || "").trim();
    if (!t){ $("#sa-text").focus(); return; }
    const p = f.dataset.parent ? secById(f.dataset.parent) : null;
    const msg = p ? `Crea una subsección dentro de «${p.name}» (id ${p.id}) para: ${t}` : `Crea una sección para organizar: ${t}. Si tiene partes distintas, añade subsecciones.`;
    swapLayer(() => openAI(msg));
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "lt-in"){ e.preventDefault(); $("[data-act=link-task]")?.click(); } });
document.addEventListener("change", e => {
  const t = e.target;
  const st = t.closest("[data-stars]");
  if (st){ const v = +($("input:checked", st)?.value || 0); $$("label", st).forEach((l, i) => l.classList.toggle("on", i < v)); }
  if (t.closest("form[data-form=prefs]")){ S.settings.sound = $("#pf-sound").checked; putSettings(); }
  if ($(".sheet")?._sec && (t.dataset.fp === "type" || t.dataset.sk === "dateKey")){ syncDraftSec(); redrawSecEditor(); }
});
document.addEventListener("input", e => {
  const t = e.target, k = t.dataset.input;
  if (k === "noteq"){ S.noteQuery = t.value; render(); }
  if (k === "secq"){ S.secQuery[t.dataset.sec] = t.value; render(); }
});
$("#importFile").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    const o = JSON.parse(await file.text());
    if (o.app !== "orbita" || !Array.isArray(o.items)) throw 0;
    const st = {...(o.settings || {})};
    if (!st.profile) st.profile = {name:st.name || ""};
    if (!st.sections) st.sections = [];
    S.settings = st; putSettings(true);
    for (const it of o.items) if (it && it.id && it.kind) putItem(it, true);
    if ($("#onb")){ onbDraft = null; $("#onb").remove(); }
    S.greet = null; lastRoute = null; flushBulk(); location.hash = "inicio"; render();
    toast("Copia importada", `${o.items.length} elementos recuperados.`);
  } catch { toast("Archivo no válido", "Elige una copia exportada desde Órbita (.json)."); }
});

/* ================= gestures & tilt ================= */
function bindSwipe(){
  const g = $("#cal"); if (!g) return;
  let x0 = null, y0 = 0;
  g.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; });
  g.addEventListener("pointerup", e => { if (x0 === null) return; const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) moveMonth(dx < 0 ? 1 : -1); });
}
const fine = window.matchMedia("(hover:hover) and (pointer:fine)");
let tiltRaf = 0, tx = 0, ty = 0;
function tilt(x, y){ tx = x; ty = y; if (tiltRaf) return; tiltRaf = requestAnimationFrame(() => { tiltRaf = 0; const g = $("#greet"); if (g && !reduce.matches) g.style.transform = `rotateX(${(-ty * 12).toFixed(2)}deg) rotateY(${(tx * 16).toFixed(2)}deg)`; }); }
addEventListener("pointermove", e => { if (fine.matches) tilt(e.clientX / innerWidth - .5, e.clientY / innerHeight - .5); }, {passive:true});
addEventListener("deviceorientation", e => { if (e.gamma == null) return; tilt(Math.max(-.5, Math.min(.5, e.gamma / 70)), Math.max(-.5, Math.min(.5, (e.beta - 45) / 90))); }, {passive:true});

/* ================= reminders ================= */
const fired = new Set(lsGet("orbita.fired", []));
function checkAlerts(){
  if (!S.ready || !S.settings || S.locked) return;
  const now = Date.now(), tk = todayKey(), due = [];
  for (const r of ofKind("reminder")){
    if (r.done || !r.date || !r.time) continue;
    const at = parseYmd(r.date).getTime() + (+r.time.slice(0, 2))*36e5 + (+r.time.slice(3, 5))*6e4, key = `r:${r.id}:${r.date}T${r.time}`;
    if (at <= now && now - at < 12*36e5 && !fired.has(key)) due.push({key, it:r, title:r.title, text:`Aviso · ${r.time}`});
  }
  for (const e of ofKind("event")){
    if (e.alert === "" || e.alert == null || !e.time) continue;
    for (const k of [tk, ymd(addDays(new Date(), 1))]){
      if (!occursOn(e, k)) continue;
      const start = parseYmd(k).getTime() + (+e.time.slice(0, 2))*36e5 + (+e.time.slice(3, 5))*6e4, at = start - (+e.alert)*6e4, key = `e:${e.id}:${k}`;
      if (at <= now && now < start + 30*6e4 && !fired.has(key)) due.push({key, it:e, title:e.title, text:+e.alert === 0 ? `Empieza ahora · ${e.time}` : `Empieza ${relDay(k).toLowerCase()} a las ${e.time}`});
    }
  }
  for (const d of due){
    fired.add(d.key);
    toast(d.title, d.text, {alert:true, actions:d.it.kind === "reminder" ? `<button class="btn sm" data-snooze>+10 min</button><button class="btn sm" data-done>Hecho</button>` : "", onMount(el){
      el.querySelector("[data-done]")?.addEventListener("click", () => { const it = S.items.get(d.it.id); if (it) putItem({...it, done:true}); el.remove(); });
      el.querySelector("[data-snooze]")?.addEventListener("click", () => { const it = S.items.get(d.it.id); const t = new Date(Date.now() + 10*6e4); if (it) putItem({...it, date:ymd(t), time:`${pad(t.getHours())}:${pad(t.getMinutes())}`, done:false}); el.remove(); toast("Te aviso en 10 minutos"); });
    }});
  }
  if (due.length){ chime(); lsSet("orbita.fired", [...fired].slice(-300)); }
}
let lastDay = todayKey(), lastMin = -1;
setInterval(() => {
  const n = new Date();
  if (n.getMinutes() === lastMin) return;
  lastMin = n.getMinutes(); checkAlerts();
  if (todayKey() !== lastDay){ const prev = lastDay; lastDay = todayKey(); if (S.cal.sel === prev) S.cal = {y:n.getFullYear(), m:n.getMonth(), sel:lastDay}; S.greet = null; render(); }
}, 5000);

/* ================= boot ================= */
(async function boot(){
  const t0 = Date.now();
  await initStore();
  if (S.settings && !S.settings.profile) S.settings.profile = {name:S.settings.name || ""};
  if (S.settings && !S.settings.sections) S.settings.sections = [];
  S.ready = true;
  if (!S.settings) showOnboarding();
  else if (S.settings.pin) showLock();
  else { render(); checkAlerts(); }
  const wait = Math.max(0, (reduce.matches ? 200 : 1300) - (Date.now() - t0));
  setTimeout(() => { const sp = $("#splash"); sp.classList.add("out"); setTimeout(() => sp.remove(), 500); fitGreet(); }, wait);
  if (!window.claude && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
})();
</script>
